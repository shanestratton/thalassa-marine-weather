# ── Edge function JWT verification ────────────────────────────────────────
#
# Whether the platform verifies a JWT before a function runs is otherwise a
# DEPLOY-TIME FLAG (`--no-verify-jwt`), which means it lives in whoever's
# shell history ran the last deploy. That is exactly the kind of unwritten
# state that drifts: a blanket `--no-verify-jwt` across a batch silently
# strips edge auth from functions that had it, and nothing in the repo would
# show it. Declared here instead, so the setting is reviewable and a deploy
# cannot quietly change it.
#
# Anything NOT listed defaults to verify_jwt = true. Note that Supabase's anon
# key IS a JWT, so verification still permits anonymous callers — it only
# rejects requests carrying no credential at all.

[functions.delete-account]
# Irreversible authenticated mutation. Keep gateway verification explicit in
# source control in addition to the function's own getUser() identity check.
verify_jwt = true

[functions.register-apple-token]
# Accepts a one-time Apple authorization code only after native Supabase auth,
# then stores the resulting refresh token behind the service role. Both the
# gateway and the function independently verify the caller's session.
verify_jwt = true

[functions.apple-server-notification]
# Apple cannot present a Supabase JWT. The receiver accepts no browser
# credential and instead verifies Apple's RS256 JWS, issuer, and exact App-ID
# audience before writing a service-role-only pending event.
verify_jwt = false

[functions.voyage-log]
# The public voyage log. src/voyageLogApi.ts:206 fetches this with a bare
# `fetch(url)` — no apikey, no Authorization — because the page is meant to
# work for a shore contact holding nothing but the link. Verification here
# would take the public log offline. The function guards itself instead: it
# resolves the handle and returns only what that vessel has published.
verify_jwt = false

[functions.float-plan]
# Historical public route-plan API. The source is now a 410 tombstone with no
# database access, and must remain reachable without a JWT so old public links
# receive the explicit fail-closed response rather than an ambiguous gateway
# error. Do not restore service-role route lookup for the public beta.
verify_jwt = false

[functions.proxy-himawari-ir]
# Satellite tile proxy. Tile URLs are consumed by the map's raster source,
# which cannot attach an Authorization header, so verification is impossible
# rather than merely undesirable.
verify_jwt = false

[functions.proxy-rainbow]
# Rainbow.ai proxy (Glass radar card + RainForecastCard). Matches deployed
# reality as of 2026-08-04: credentialless requests reach the function (the
# Pi cache passthrough fetches tiles server-side with no Supabase credential
# at all, so platform verification must stay off). The function self-guards
# via requireAuthenticatedOrPublicQuota — real user JWTs get the full
# 240/hr + 4000 tiles/hr buckets; anon-key or credentialless callers land in
# small per-IP public buckets (30/hr snapshots — exhausting THAT is what
# killed the old dashboard radar, which fetched its snapshot with no auth).
verify_jwt = false

# ── Credentialed functions reconciled from the live gateway ───────────────
#
# Each caller below already supplies a user or anon JWT. Pinning `true` adds
# the gateway check without removing the function's own identity/quota guard.

[functions.elevenlabs-tts]
# Signed-in voice client; the function also enforces an authenticated quota.
verify_jwt = true

[functions.fetch-wind-grid]
# App and Pi-cache callers supply a user or anon JWT before quota selection.
verify_jwt = true

