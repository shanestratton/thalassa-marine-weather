<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0f172a" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="description" content="Live voyage log — follow the passage at sea." />
        <title>Voyage Log — Thalassa</title>
        <link rel="stylesheet" href="/index.css" />
        <style>
            /* AIS popup — strip Mapbox's default white shell so the dark
               glass card inside is what shows. */
            .voyage-log-ais-popup .mapboxgl-popup-content {
                background: transparent;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }
            .voyage-log-ais-popup .mapboxgl-popup-tip {
                border-top-color: rgb(15 23 42);
                border-bottom-color: rgb(15 23 42);
                border-left-color: rgb(15 23 42);
                border-right-color: rgb(15 23 42);
            }
            /* Lift the satellite basemap out of "goth" — affects only the
               raster canvas, not markers/popups/labels (those are HTML). */
            .voyage-log-sat-bright .mapboxgl-canvas {
                /* Shane 2026-09-02: "the map seems to have a milky layer over
                   it." This was it — not a map layer at all, a filter over the
                   whole canvas. brightness(1.18) against contrast(1.02) lifts
                   the blacks without restoring any separation, which is the
                   textbook recipe for a washed-out image.

                   It was compensating for the old flat MapTiler ocean tint,
                   which used to darken the imagery at every zoom. That tint
                   now fades with zoom, so the compensation had become pure
                   haze over the photography it was meant to rescue. What is
                   left is a touch of saturation for punch and a little real
                   contrast to put the blacks back. */
                filter: saturate(1.08) contrast(1.06);
            }
            /* Provider logo and attribution controls deliberately remain
               visible. They are required map provenance, including when the
               satellite style or MapTiler bathymetry is selected. */
        </style>
    </head>
    <body class="bg-slate-900">
        <div id="root"></div>
        <script type="module" src="/src/logs-main.tsx"></script>
    </body>
</html>
