<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="color-scheme" content="light dark" />
        <title>Box tag — Thalassa</title>
        <!-- Served for https://www.thalassawx.app/box/<id> (vercel.json) to a phone without
             Thalassa held to a Ship's Stores box tag (126-11b). No script, no data and no
             request but this page: it never shows the id, the contents or the boat. -->
        <link rel="icon" href="data:," />
        <style>
            :root {
                --bg: #f8fafc;
                --card: #ffffff;
                --border: #e2e8f0;
                --text: #0f172a;
                --muted: #475569;
                --accent: #0369a1;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0f172a;
                    --card: #111c33;
                    --border: rgba(255, 255, 255, 0.08);
                    --text: #e2e8f0;
                    --muted: #94a3b8;
                    --accent: #38bdf8;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px 16px;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }
            main {
                width: 100%;
                max-width: 28rem;
                padding: 24px 20px;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--card);
            }
            h1 {
                margin: 0 0 12px;
                font-size: 1.25rem;
                line-height: 1.3;
            }
            p {
                margin: 0 0 12px;
                overflow-wrap: anywhere;
            }
            p:last-child {
                margin-bottom: 0;
            }
            .muted {
                color: var(--muted);
                font-size: 0.9375rem;
            }
            a {
                color: var(--accent);
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>A Thalassa box tag</h1>
            <p>This tag belongs to a stowage box on a boat that uses Thalassa.</p>
            <p class="muted">
                The tag holds only a random number. The boat's crew hold an iPhone with Thalassa to it to see what is in
                the box.
            </p>
            <p class="muted">Thalassa is a marine weather and passage-planning app: <a href="/">thalassawx.app</a></p>
        </main>
    </body>
</html>
