[package]
name = "thalassa-vodozemac-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

# Isolated native-boundary research. Never an application dependency.
[workspace]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
tooling = ["uniffi/cli"]

[dependencies]
vodozemac = { version = "=0.11.0", default-features = false }
uniffi = { version = "=0.29.4", default-features = false }
zeroize = "=1.9.0"
thiserror = "=2.0.20"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["tooling"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
