# thalassa-cache, Pi update 3 (127-C-d decision 14):
# /etc/systemd/system/thalassa-cache.service.d/20-chart-vault.conf
#
# Wants= only, never Requires=: the watch starts even if the vault does not.
# LimitCORE=0 because chunks of a cell pass through this process on their way
# to the phone, and a core dump would put them on a disk.
# CPUWeight=300: the vault's CPUQuota turns the cgroup cpu controller on in
# system.slice, where every service then counts by its CPUWeight, not its Nice.
# 300 keeps the share Nice=-5 gave the watch's process over services at the
# default 100, and 30x the vault's 10 (vault/limits.ts serviceCpuWeight).
[Unit]
Wants=thalassa-chart-vault.service

[Service]
LimitCORE=0
CPUWeight=300
