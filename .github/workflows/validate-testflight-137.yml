          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {stageUpdate5} from './pi-cache/scripts/stage-update5.mjs';
          import {stageUpdate6} from './pi-cache/scripts/stage-update6.mjs';
          import {stageUpdate7} from './pi-cache/scripts/stage-update7.mjs';
          import {update7NativeBuild} from './pi-cache/scripts/update7.mjs';
          const repository=process.cwd(),commit=process.env.CANDIDATE_SHA,previous=process.env.PREVIOUS136_SHA;
          const git=(args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          assert.equal(git(['rev-parse','HEAD']),commit);
          const master=git(['rev-parse','refs/remotes/origin/master^{commit}']);
          assert.equal(master,previous,'Fetched master must be exact shipped136');
          assert.equal(update7NativeBuild(fs.readFileSync('ios/App/App.xcodeproj/project.pbxproj','utf8')),137);
          assert.equal(spawnSync('git',['merge-base','--is-ancestor',master,commit]).status,0);
          assert.equal(spawnSync('git',['merge-base','--is-ancestor',commit,master]).status,1);
          const proof=path.join(process.env.RUNNER_TEMP,'pi-pre-release-refusal');
          fs.mkdirSync(proof,{recursive:false});
          const attempts=[];
          for(const [update,stage,expected] of [[5,stageUpdate5,/Exactly four matching native build-133, build-134 or build-135 configurations are required/],[6,stageUpdate6,null],[7,stageUpdate7,null]]){
            const output=path.join(process.env.RUNNER_TEMP,`pi-update${update}-must-remain-absent`);
            assert.equal(fs.existsSync(output),false);
            let error;
            try {stage({repository,commit,output});}catch(caught){error=caught;}
            assert.ok(error,`Update ${update} incorrectly staged an unshipped build137`);
            if(expected)assert.match(error.message,expected);else {assert.equal(error.status,1);assert.match(error.message,/merge-base --is-ancestor/);}
            assert.equal(fs.existsSync(output),false,'Refusal must precede all bundle output');
            attempts.push({update,refused:true,noOutput:true,reason:update===5?'Native137 is outside existing update5 allowlist':'Candidate137 is not yet an ancestor of shipped master'});
          }
          fs.writeFileSync(path.join(proof,'REFUSAL.json'),JSON.stringify({commit,master,pinned136:previous,attempts,hardwareContact:false},null,2)+'\n');
          NODE
          sha256sum pi-cache/scripts/stage-update5.mjs pi-cache/scripts/update5.mjs pi-cache/scripts/stage-update6.mjs pi-cache/scripts/update6.mjs pi-cache/scripts/stage-update7.mjs pi-cache/scripts/update7.mjs > "$RUNNER_TEMP/pi-pre-release-refusal/SHA256SUMS"
      - name: Preserve actual-source pre-release staging refusal evidence
