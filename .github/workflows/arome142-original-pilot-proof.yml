name: AROME142 fixed one-original NCALED pilot
on:
    push:
        branches: [codex/build-142-arome-original-pilot-proof]
        paths: [.github/workflows/arome142-original-pilot-proof.yml]
permissions:
    contents: read
concurrency:
    group: arome142-ncaled-original-pilot-v1
    cancel-in-progress: false
jobs:
    pilot:
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/build-142-arome-original-pilot-proof' && github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            PROOF_SOURCE_SHA: 9f2364baa85ed1ef4b796379789b8140616fa721
            PILOT_CONTROLLER_SHA: e4408f7a961de9f8a3997cda1290b188543aa92e
            PYTHONDONTWRITEBYTECODE: '1'
            OPENBLAS_NUM_THREADS: '1'
            OMP_NUM_THREADS: '1'
        steps:
            - name: Checkout reviewed control definition
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  path: controls
                  fetch-depth: 0
                  persist-credentials: false
            - name: Checkout exact unchanged9f decoder
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: 9f2364baa85ed1ef4b796379789b8140616fa721
                  path: source
                  persist-credentials: false
            - name: Set up proven Python3.11.15
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.11.15'
            - name: Set up proven Node24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
            - name: Run reviewed once-only original and confined native phases
              shell: bash
              run: bash controls/ci/arome142-original-pilot/run.sh
            - name: Preserve bounded partial or complete evidence
              if: always()
              shell: bash
              run: python controls/ci/arome142-original-pilot/collect.py
            - name: Preserve original source and proof on every outcome
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: arome142-one-original-${{ github.run_id }}
                  path: ${{ runner.temp }}/arome142-original-pilot-artifact
                  if-no-files-found: error
                  retention-days: 14
