                    "browser-tests/helpers/windPixelCapture.ts": "2276c315e81cab1fe799cb6dd69c1085725fae3b1d32315a3248ec77afc4b05b",
                    "browser-tests/helpers/chartCaptureReady.ts": "02ffb464cd22d0d8eb3c67c08be3bd96f788328405cb0e6bec5f16a71a69b1e9",
                    "tests/WindPixelCapture.test.ts": "c748bf98b6f3c8348f399bcbf83222cf69f3410d925ce8fc7c25c7f195edf28f",
                    "tests/helpers/colourScience.ts": "3e137524d0bdc83026c1e6215ff1e6ff2661a63ddf1961546ede00b7ea918de1",
                    "playwright.keyboard.config.ts": "3213abfde7ee7461d475c7b630a3c485551bb5ed2c402018fb7fd5d9132f218a",
                    "components/map/MapboxVelocityOverlay.tsx": "bd2765c24dd9c1f95952c002ca90b2554d1bd28a7278527472ac24e5deeae79e",
                    "components/map/windRamp.ts": "22770f25d075fde7d7c9fae92fab4e62117428349723bf5379174716bb1e34ed",
                    "components/map/MapHub.tsx": "4cb24cdf1fc8d50e984048bdd5bb10048e00a366f0813c0c7d609710774d384a",
                    "components/map/reliefBase.ts": "9ce10e0afdbec2bc4dcfa597f879cf184ad78691e0339c4dabe7bed54b0ceb45",
                    "components/map/useMapInit.ts": "4124705ad87fb5d72d4fa0a842fc3622cb39dedfa2fd1f47ad140a7b25e8f302",
