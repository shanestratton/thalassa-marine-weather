                  const blobs={"framebuffer-reader.mjs":"","framebuffer-preload.cjs":"","prepare-integration.cjs":""};
                  for(const [name,encoded] of Object.entries(blobs)){
                    const bytes=Buffer.from(encoded,'base64');
                    if(createHash('sha256').update(bytes).digest('hex')!==pins[name])throw Error('Reviewed control bytes differ');
