# DIAGNOSTIC ONLY: one unchanged 150-second case per original browser/profile.
# Extra genuine render callback plus at most8 tiny default-framebuffer readPixels per observed screenshot.
# No bitmap substitution/normalization, no wind pause, no camera/paint/source changes, no GL binds/finish.
# Instrumented observations never clear strict/all-ten/signing/release gates.
name: Thalassa 127 fictional native framebuffer diagnostic

# Exact reviewed application commit, including explicit test PNG dependency.
# Workflow/application identities are distinct. Test-only sampling repair:
# four native full-viewport captures, exact byte crops at original CSS clips.
# The capture body is REVISED, not original-body byte-identical. Eight original
# expect statements AND complete colour-predicate/assertion blocks remain exact.
# No Apple secrets, production deployment, signing/upload, palette/camera/buffer-bind mutation; diagnostic repaint/readback only.
on:
    push:
        branches: ['codex/testflight-127-fictional-gl-diagnostic-2026-10-12']
        paths: ['.github/workflows/testflight-127-fictional-gl-diagnostic.yml']

permissions:
    contents: read

concurrency:
    group: testflight-127-fictional-gl-diagnostic
    cancel-in-progress: false

env:
    CANDIDATE_SHA: '954f6bbda2cb8e2f11001b67988a28ce50c4dd18'
    CI: 'true'
    HUSKY: '0'
    NODE_OPTIONS: --max-old-space-size=4096
    PUPPETEER_SKIP_DOWNLOAD: 'true'
    VITE_APP_BUILD: '127'
    VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
    VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
    VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
    VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}


jobs:
    focused-wind:
        name: fictional framebuffer diagnostic (${{ matrix.browser }})
        if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, webkit]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: '954f6bbda2cb8e2f11001b67988a28ce50c4dd18'
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: npm
            - name: Pin revised capture body, unchanged original assertions and original profile
              id: source
              env:
                  VERIFY_PHASE: before
                  BROWSER: ${{ matrix.browser }}
              run: |
                  node --input-type=module <<'NODE'
                  // Source verification only. Native execution is separately instrumented; these source checks do not change it.
                  import {readFileSync,writeFileSync,readdirSync,lstatSync} from 'node:fs';
                  import {join,relative} from 'node:path';
                  import {createHash} from 'node:crypto';
                  import {execFileSync} from 'node:child_process';
