                      files.push({path:relative('.',path),sha256:sha(bytes),bytes:bytes.length,width:bytes.readUInt32BE(16),height:bytes.readUInt32BE(20),depth:bytes[24],colourType:bytes[25]});
                     }
                     if(files.length>4) throw Error('Unexpected extra measured pair files');
                    }
                   }
                   visit('test-results');
                   output.proofOutcome=process.env.PROOF_OUTCOME;
                   output.observedResults=stats;
                   output.measuredPairFiles=files.sort((a,b)=>a.path.localeCompare(b.path));
                   output.expectedCompletePairFiles=4;
                   output.positiveOutputRetention='original configuration leaves Playwright preserveOutput at its installed always default; diagnostic Node preload added; original screenshot/profile flags unchanged';
                   output.positivePairRetentionComplete=!!stats&&stats.expected===1&&stats.unexpected===0&&stats.flaky===0&&stats.skipped===0&&files.length===4;
                  }
                  writeFileSync('wind-source-hashes-'+phase+'.json',JSON.stringify(output,null,2)+'\n',{flag:'wx',mode:0o600});
                  if(phase==='after'&&process.env.PROOF_OUTCOME==='success'&&!output.positivePairRetentionComplete) throw Error('Successful run must retain one measured pair per base');
                  console.log(JSON.stringify({phase,browser,sourcePins:sourceInputs.length,revisedBodyVerified:true,eightOriginalExpectsVerified:true,completeOriginalBlocksVerified:true,
                   measuredPairFiles:output.measuredPairFiles?.length??null,proofOutcome:output.proofOutcome??null}));
                  NODE
            - name: Record actual focused result and honest body scope
              if: always() && steps.source.outcome == 'success'
              env:
                  PROOF_OUTCOME: ${{ steps.proof.outcome }}
                  BROWSER: ${{ matrix.browser }}
              run: |
                  echo "$BROWSER INSTRUMENTED DIAGNOSTIC repetition: $PROOF_OUTCOME on $CANDIDATE_SHA. Eight original expect lines/full colour assertion blocks and 150s budget/profile unchanged; 1 diagnostic repetition/0 retries/no forced tracing; explicit native-frame readback instrumentation. Actual ON/OFF pair PNGs retained on success and failure. Diagnostic observation only, never strict/release acceptance or a proven compositor cause." >> "$GITHUB_STEP_SUMMARY"
            - name: Retain real native-frame observations and explicit unavailable states
              if: always()
              run: |
                  node --input-type=module <<'NODE'
                  import {readdirSync,readFileSync,lstatSync,copyFileSync} from 'node:fs';
                  import {join} from 'node:path';
                  import {createHash} from 'node:crypto';
                  const root=join(process.env.RUNNER_TEMP,'fictional-gl-controls');
                  const output=join(root,'output');let count=0,workers=0,observed=0;
                  const pins={"framebuffer-reader.mjs":"ab2f71e170db39a0b74d6520dbf92dcc4fa23045c0b2b2c56495d1b2167d24bf","framebuffer-preload.cjs":"d3407c19698641de1df77db919a898e8ecdafd7e4b7c228c4eab5d3f138cdcb5","prepare-integration.cjs":"0c360cfb02d23511c51ff405e240f7a5e14b776c77f98da0143504e4498ecf0c"};
                  for(const [name,expected] of Object.entries(pins))if(createHash('sha256').update(readFileSync(join(root,name))).digest('hex')!==expected)throw Error('Control bytes changed during execution');
                  for(const processName of readdirSync(output)){
                    if(!/^process-\d+$/.test(processName))throw Error('Unexpected diagnostic output');
                    const path=join(output,processName,'framebuffer-observations.json'),stat=lstatSync(path);
                    if(!stat.isFile()||stat.isSymbolicLink()||stat.size>262144||(stat.mode&0o777)!==0o600)throw Error('Private bounded output differs');
                    const bytes=readFileSync(path),report=JSON.parse(bytes);
                    if(report.pins.requestedSource!==process.env.CANDIDATE_SHA||report.pins.readerSha256!==pins['framebuffer-reader.mjs']||report.pins.loaderSha256!==pins['framebuffer-preload.cjs']||report.pins.generatorSha256!==pins['prepare-integration.cjs']||report.acceptanceEvidence!==false||!report.diagnosticOnly||!report.externalExecutionReceiptRequired||report.promiseIdentityPreserved!==false||!Array.isArray(report.observations)||report.observations.length>8)throw Error('Diagnostic receipt binding differs');
                    count+=report.observations.length;
                    if(report.entryKind==='playwright-worker-entry'&&report.observations.length>0){workers++;observed+=report.observations.filter(row=>row.packet?.status==='observed'&&row.packet.readPixelCalls===8).length;}
                    copyFileSync(path,'fictional-gl-observations-'+processName+'.json',1);
                    console.log(JSON.stringify({file:'fictional-gl-observations-'+processName+'.json',sha256:createHash('sha256').update(bytes).digest('hex'),observations:report.observations,diagnosticOnly:true,acceptanceEvidence:false}));
                  }
                  if(count===0||workers===0)throw Error('No actual screenshot-worker observation survived; missing evidence is not a pass');
                  console.log(JSON.stringify({actualScreenshotWorkerReceipts:workers,observedEightReadPackets:observed,unavailableOrPendingPacketsNotZeroAttemptEvidence:true,strictAcceptance:false}));
                  console.log('Extra render/readback perturbs GPU timing. Unavailable states and real overshoot are retained. This is not release acceptance.');
                  NODE
            - name: Preserve JSON, source hash receipts and actual measured pair PNGs on success too
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build127-fictional-framebuffer-${{ matrix.browser }}
                  path: |
                      fictional-gl-observations-*.json
                      wind-focused-results.json
                      wind-source-hashes-before.json
                      wind-source-hashes-after.json
                      test-results/**/desk-wind-light-streaks-*.png
                      test-results/**/desk-wind-relief-sat-streaks-*.png
                  retention-days: 7
                  if-no-files-found: warn
