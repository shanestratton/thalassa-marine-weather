name: Build142 isolated cabin SQLite and operator proof
on:
    push:
        branches: ['codex/build-142-cabin-native-proof']
        paths: ['.github/workflows/cabin-native-142.yml']
    workflow_dispatch:
        inputs:
            source_sha:
                description: Exact reviewed source commit
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: cabin142-isolated-${{ github.run_id }}
    cancel-in-progress: false
jobs:
    sqlite:
        if: github.event_name == 'push' && github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 14
        env:
            SOURCE_SHA: 5daf8d5d7e055cfc7d515485fe335c2bfa12883b
        steps:
            - name: Require exact source
              shell: bash
              run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: 5daf8d5d7e055cfc7d515485fe335c2bfa12883b
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
            - name: Install locked dependencies and capture immutable inputs
              timeout-minutes: 4
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
                  mkdir -p "$RUNNER_TEMP/cabin142-proof"
                  git rev-parse HEAD > "$RUNNER_TEMP/cabin142-proof/SOURCE_SHA.txt"
                  node --version > "$RUNNER_TEMP/cabin142-proof/NODE_VERSION.txt"
                  npm --version > "$RUNNER_TEMP/cabin142-proof/NPM_VERSION.txt"
                  git ls-files pi-cache/package.json pi-cache/package-lock.json pi-cache/tsconfig.json pi-cache/src pi-cache/scripts/cabin-native142-proof.mts pi-cache/scripts/cabin-native142-proof.tsconfig.json | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/cabin142-proof/SHA256SUMS"
                  npm ci --prefix pi-cache --ignore-scripts --no-audit --no-fund
            - name: Build locked native SQLite and actual compiled Pi source
              timeout-minutes: 5
              shell: bash
              run: |
                  set -euo pipefail
                  npm rebuild --prefix pi-cache better-sqlite3 --build-from-source 2>&1 | tee "$RUNNER_TEMP/cabin142-proof/NATIVE_BUILD.txt"
                  sha256sum pi-cache/node_modules/better-sqlite3/build/Release/better_sqlite3.node > "$RUNNER_TEMP/cabin142-proof/NATIVE_SHA256.txt"
                  node -p "require('./pi-cache/node_modules/better-sqlite3/package.json').version" > "$RUNNER_TEMP/cabin142-proof/SQLITE_PACKAGE_VERSION.txt"
                  npm run build --prefix pi-cache 2>&1 | tee "$RUNNER_TEMP/cabin142-proof/PI_BUILD.txt"
                  node pi-cache/node_modules/typescript/bin/tsc -p pi-cache/scripts/cabin-native142-proof.tsconfig.json 2>&1 | tee "$RUNNER_TEMP/cabin142-proof/OPERATOR_PROOF_TYPES.txt"
            - name: Real SQLite ownership, command boundaries and compiled operator under isolated networking
              timeout-minutes: 3
              shell: bash
              run: |
                  set -euo pipefail
                  node_path=$(command -v node)
                  sudo systemd-run --unit=cabin142-native-proof --wait --pipe --collect \
                    -p MemoryMax=768M -p MemorySwapMax=0 -p TasksMax=96 -p CPUQuota=100% \
                    -p RuntimeMaxSec=120 -p TimeoutStopSec=5 -p KillMode=control-group -p SendSIGKILL=yes \
                    -p PrivateNetwork=yes -p NoNewPrivileges=yes -p CapabilityBoundingSet= \
                    -p ProtectHome=read-only -p ProtectSystem=strict -p PrivateTmp=yes \
                    -p User="$(id -un)" -p WorkingDirectory="$GITHUB_WORKSPACE/pi-cache" \
                    /usr/bin/env -i PATH="$(dirname "$node_path"):/usr/bin:/bin" \
                    THALASSA_DISPOSABLE_CABIN_TEST=1 \
                    /bin/bash -euo pipefail -c '
                      node --import tsx --test src/readAuthorityGeneration.test.mts src/cabin/*.test.mts src/piCommandLock.test.mts
                      node --import tsx scripts/cabin-native142-proof.mts
                    ' 2>&1 | tee "$RUNNER_TEMP/cabin142-proof/BOUNDARIES_AND_OPERATOR.txt"
                  if systemctl is-active --quiet cabin142-native-proof.service; then exit 1; fi
                  printf '0\n' > "$RUNNER_TEMP/cabin142-proof/PROCESS_EXIT.txt"
            - name: Preserve bounded source and test evidence only
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: build142-cabin-native-proof
                  path: ${{ runner.temp }}/cabin142-proof/
                  retention-days: 7
                  if-no-files-found: error
