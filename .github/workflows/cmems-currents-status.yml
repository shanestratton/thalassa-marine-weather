name: CMEMS Currents — Tileset Status (Retired)

# Retained as an explicit tombstone so the obsolete secret-bearing Mapbox
# status poller cannot be dispatched while old integrations are removed.
on:
    workflow_dispatch:

permissions: {}

jobs:
    retired:
        runs-on: ubuntu-24.04
        timeout-minutes: 1
        permissions: {}
        steps:
            - name: Refuse retired Mapbox tileset status poll
              run: |
                  echo "::notice::Retired: CMEMS no longer publishes or polls Mapbox tilesets."
                  exit 78
