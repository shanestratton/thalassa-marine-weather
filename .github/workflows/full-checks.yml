name: Full checks

# The slow suites, off the per-push path (ci.yml runs the quick checks):
#   - every night: the unit tests with coverage, when master changed that day;
#   - Sunday night: everything: the unit tests, the two-browser E2E against the
#     built app, and the daylight/keyboard/split-pane and Plan Your Day
#     regressions (skipped when nothing changed all week);
#   - Run workflow: everything, on the chosen branch. Do this before a
#     TestFlight upload.
# Times are UTC; 16:23 UTC is 02:23 in Brisbane the next morning.
on:
    schedule:
        - cron: '23 16 * * 1-6'
        - cron: '23 16 * * 0'
    workflow_dispatch:

concurrency:
    group: full-checks-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    plan:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            unit: ${{ steps.plan.outputs.unit }}
            browsers: ${{ steps.plan.outputs.browsers }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Decide what to run
              id: plan
              env:
                  EVENT: ${{ github.event_name }}
                  SCHEDULE: ${{ github.event.schedule }}
              run: |
                  set -euo pipefail
                  age_hours=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 3600 ))
                  unit=false
                  browsers=false
                  if [ "$EVENT" = workflow_dispatch ]; then
                      unit=true
                      browsers=true
                  elif [ "$SCHEDULE" = '23 16 * * 0' ]; then
                      if [ "$age_hours" -lt 170 ]; then unit=true; browsers=true; fi
                  elif [ "$age_hours" -lt 26 ]; then
                      unit=true
                  fi
                  echo "Last commit ${age_hours} h ago: unit tests $unit, browser suites $browsers" | tee -a "$GITHUB_STEP_SUMMARY"
                  echo "unit=$unit" >> "$GITHUB_OUTPUT"
                  echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

    unit:
        needs: plan
        if: needs.plan.outputs.unit == 'true'
        runs-on: ubuntu-24.04
        # About 20 minutes with coverage on a 4-core runner (run 38049024556).
        timeout-minutes: 90
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Cheap, and ci.yml skips documentation-only pushes that this reads.
            - name: Public beta source contract
              run: npm run check:beta:source

            - name: Run unit tests with coverage
              run: npx vitest run --reporter=verbose --coverage

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 7

    e2e:
        needs: plan
        if: needs.plan.outputs.browsers == 'true'
        runs-on: ubuntu-24.04
        # About 40 minutes on a 4-core runner (run 38049024556).
        timeout-minutes: 150
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Public beta release configuration
              run: npm run check:beta

            - name: Build
              env:
                  VITE_APP_BUILD: ${{ vars.VITE_APP_BUILD }}
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium webkit

            - name: Run E2E tests
              run: npx playwright test --project=chromium --project=mobile-safari

            - name: Upload E2E artifacts on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # The daylight, keyboard and split-pane browser regressions run beside the
    # check job, not inside it (build 123, 2026-10-08). They need no build:
    # playwright.keyboard.config.ts serves its fixtures from the dev server.
    # Inside the check job they had grown to ~17+ min and build 123 added
    # several hundred more layout cases, while the check job already ran
    # 75-117 min against its 120-min cap (run 37562508850: 117 min).
    #
    # Split into parallel parts (build 126, 2026-10-10): one job ran 87 min on
    # 125 (run on 058ba16e) and 126's new layout specs pushed it past its
    # 90-min cap, so run 38024171407 was cancelled mid-suite. Three keyboard
    # shards plus Plan Your Day fit run side by side, each well inside 60 min.
    #
    # Moved here from ci.yml in 2026-10. 120 minutes: a private repository's
    # runner has 2 cores, and the longest shard took 42 minutes on 4.
    browser-regressions:
        name: browser-regressions (${{ matrix.suite }} ${{ matrix.shard }})
        needs: plan
        if: needs.plan.outputs.browsers == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: keyboard
                      shard: 1/3
                    - suite: keyboard
                      shard: 2/3
                    - suite: keyboard
                      shard: 3/3
                    - suite: plan-your-day
                      shard: ''
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium webkit

            - name: Daylight, keyboard and split-pane browser regressions (shard ${{ matrix.shard }})
              if: ${{ matrix.suite == 'keyboard' }}
              run: npx playwright test --config playwright.keyboard.config.ts --shard=${{ matrix.shard }}

            # Plan Your Day fits one screen (build 124): every screen of the
            # sheet from 320 x 568 up, in DejaVu Sans as this runner draws it,
            # under the real tab bar. Its own config serves the fixture against
            # a non-routable Supabase URL. Its own matrix part, so a keyboard
            # failure can never hide it (or the other way round).
            - name: Plan Your Day fit
              if: ${{ matrix.suite == 'plan-your-day' }}
              run: npx playwright test --config playwright.day-planner.config.ts

            - name: Upload browser-regression artifacts on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: browser-regressions-report-${{ strategy.job-index }}
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
