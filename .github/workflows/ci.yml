name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            NODE_OPTIONS: --max-old-space-size=4096

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Dependency audit (critical = fail)
              run: npm audit --audit-level=critical

            - name: Dependency audit (high = warn)
              run: npm audit --audit-level=high || echo "::warning::High-severity vulnerabilities found — run npm audit for details"

            # Two-way hygiene: dead-declared prod deps AND phantom imports
            # (undeclared packages riding hoisted trees — removing an
            # unrelated dep breaks the build, as @turf/line-intersect proved
            # 2026-08-03). Allowlists live in the script.
            - name: Dependency hygiene (dead + phantom)
              run: node scripts/check-deps.mjs

            - name: Lint
              run: npm run lint

            # Migration hygiene, including SECURITY DEFINER search_path pinning
            # and explicit EXECUTE grants. A definer function that inherits the
            # default EXECUTE TO PUBLIC is reachable with the anon key that
            # ships in the web bundle — that is how user_display_name came to
            # return real names out of auth.users to anonymous callers.
            - name: Migration audit
              run: npm run lint:migrations

            - name: TypeScript type check
              run: npx tsc --noEmit

            # The edge tier runs on Deno, so tsc cannot see it — tsconfig
            # excludes supabase/** because its URL imports are unresolvable to
            # Node's resolver. That exclusion, plus an eslint ignore and no
            # Deno step, meant 20.4k LOC across 47 functions had no static
            # checking of any kind. Turning this on found 48 real type errors,
            # 27 of them reading columns off supabase-js's error branch.
            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Edge function type check
              working-directory: supabase/functions
              run: deno check */index.ts

            - name: Run unit tests with coverage
              run: npx vitest run --reporter=verbose --coverage

            - name: Build
              run: npx vite build

            - name: Bundle size check
              run: npm run check:bundle

            - name: Lighthouse CI
              run: |
                  npx puppeteer browsers install chrome
                  npx lhci autorun --config=lighthouserc.cjs
                  # A disclaimer-only audit passes every budget, so verify what
                  # was actually measured before trusting a green Lighthouse.
                  node scripts/assert-lighthouse-audited-app.mjs

            - name: Install Playwright browsers
              run: npx playwright install chromium --with-deps

            - name: Run E2E tests
              run: npx playwright test --project=chromium --reporter=list

            - name: Upload E2E artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 30
