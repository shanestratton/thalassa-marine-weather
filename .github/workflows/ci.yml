name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        # Coverage alone is ~7–10 minutes on the current corpus; the same job
        # also performs a clean install/audit, full lint + migration audit,
        # TypeScript, Deno, production build, Lighthouse, and two-browser E2E.
        # Keep one bounded job, but give a healthy candidate enough headroom to
        # finish on a contended GitHub runner.
        timeout-minutes: 60
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_OWM_API_KEY: ${{ vars.VITE_OWM_API_KEY }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Runtime policy: supported Node LTS majors intentionally follow
            # their latest security patch; Deno and action code are exact.
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Dependency audit (high or critical = fail)
              run: npm audit --audit-level=high

            - name: Complete dependency tree
              run: npm ls --all

            # Two-way hygiene: dead-declared prod deps AND phantom imports
            # (undeclared packages riding hoisted trees — removing an
            # unrelated dep breaks the build, as @turf/line-intersect proved
            # 2026-08-03). Allowlists live in the script.
            - name: Dependency hygiene (dead + phantom)
              run: node scripts/check-deps.mjs

            - name: Public beta source contract
              run: npm run check:beta:source

            - name: Public beta release configuration
              run: npm run check:beta

            # Migration hygiene, including SECURITY DEFINER search_path pinning
            # and explicit EXECUTE grants. A definer function that inherits the
            # default EXECUTE TO PUBLIC is reachable with the anon key that
            # ships in the web bundle — that is how user_display_name came to
            # return real names out of auth.users to anonymous callers. The
            # lint script includes this audit, so run it once rather than
            # spending CI time on a duplicate migration pass.
            - name: Lint + migration audit
              run: npm run lint

            - name: Route registry audit
              run: npm run lint:routes

            - name: Formatting contract
              run: npm run format:check

            - name: TypeScript type check
              run: npx tsc --noEmit

            # The edge tier runs on Deno, so tsc cannot see it — tsconfig
            # excludes supabase/** because its URL imports are unresolvable to
            # Node's resolver. That exclusion, plus an eslint ignore and no
            # Deno step, meant 20.4k LOC across 47 functions had no static
            # checking of any kind. Turning this on found 48 real type errors,
            # 27 of them reading columns off supabase-js's error branch.
            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
              with:
                  # Exact locally validated stable release; action itself is
                  # independently pinned above.
                  deno-version: v2.9.4

            - name: Edge function formatting
              run: deno fmt --check supabase/functions

            - name: Edge function type check
              working-directory: supabase/functions
              run: deno check */index.ts

            - name: Edge function behavior tests
              working-directory: supabase/functions
              run: deno test */*_test.ts

            - name: Run unit tests with coverage
              run: npx vitest run --reporter=verbose --coverage

            - name: Build
              # Keep CI on the same production path used for releases. This
              # includes the pre/post-build client-secret scans in package.json.
              run: npm run build

            - name: Verify production preview routes and artifacts
              run: npm run check:web-release

            - name: Bundle size check
              run: npm run check:bundle

            - name: Install Lighthouse browser
              run: npx puppeteer browsers install chrome

            - name: Run Lighthouse audit
              id: lighthouse-audit
              run: node scripts/run-lighthouse-audit.mjs

            # A disclaimer-only audit passes every budget, so run this even when
            # the audit step reports a performance-budget failure. That proves
            # which document produced the report before anyone interprets it.
            - name: Assert Lighthouse audited the application shell
              if: ${{ always() && steps.lighthouse-audit.outcome != 'skipped' }}
              run: node scripts/assert-lighthouse-audited-app.mjs

            - name: Upload Lighthouse report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: lighthouse-report
                  path: .lighthouseci/
                  retention-days: 14
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium webkit

            - name: Run E2E tests
              run: npx playwright test --project=chromium --project=mobile-safari

            - name: Upload E2E artifacts on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 30

    # Independently deployed production boundaries use their own lockfiles and
    # runtime floors. Separate jobs prevent root dependency hoisting or Node 24
    # from concealing drift in the environments these packages actually run.
    ais-ingest:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup AIS ingest runtime
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Matches workers/ais-ingest/Dockerfile.
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: workers/ais-ingest/package-lock.json

            - name: Install AIS ingest worker dependencies
              working-directory: workers/ais-ingest
              run: npm ci

            - name: Audit AIS ingest worker dependencies
              working-directory: workers/ais-ingest
              run: npm audit --audit-level=high

            - name: Verify AIS ingest worker dependency tree
              working-directory: workers/ais-ingest
              run: npm ls --all

            - name: Build AIS ingest worker
              working-directory: workers/ais-ingest
              run: npm run build

            - name: Test AIS ingest worker
              working-directory: workers/ais-ingest
              run: npm test

    deepgram-proxy:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Deepgram proxy toolchain
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: cloudflare-worker/package-lock.json

            - name: Install Deepgram proxy dependencies
              working-directory: cloudflare-worker
              run: npm ci

            - name: Audit Deepgram proxy dependencies
              working-directory: cloudflare-worker
              run: npm audit --audit-level=high

            - name: Verify Deepgram proxy dependency tree
              working-directory: cloudflare-worker
              run: npm ls --all

            - name: Type-check Deepgram proxy
              working-directory: cloudflare-worker
              run: ./node_modules/.bin/tsc --noEmit

    pi-cache:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Pi cache runtime
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Matches the NodeSource runtime installed by install.sh.
                  node-version: 20
                  cache: 'npm'
                  cache-dependency-path: pi-cache/package-lock.json

            - name: Install Pi cache dependencies
              working-directory: pi-cache
              run: npm ci

            - name: Audit Pi cache dependencies
              working-directory: pi-cache
              run: npm audit --audit-level=high

            - name: Verify Pi cache dependency tree
              working-directory: pi-cache
              run: npm ls --all

            - name: Build Pi cache
              working-directory: pi-cache
              run: npm run build

            - name: Test Pi cache
              working-directory: pi-cache
              run: npm test
