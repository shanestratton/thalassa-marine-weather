name: CI

# Quick checks on every push and pull request: install and audit, the release
# gates, lint, formatting, types, the edge functions, the production build and
# its artifact checks, and Lighthouse. The slow suites run in full-checks.yml
# (unit tests nightly, the browser suites weekly, both on demand before a
# release) and the separately deployed packages in packages.yml. On a private
# repository every minute is billed and runners have 2 cores, so a push that
# only changes documentation is skipped here; the nightly run still reads it.
on:
    push:
        branches: [master, main]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
    pull_request:
        branches: [master, main]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        # Quick checks only since 2026-10 (the unit tests, E2E and browser
        # regressions moved to full-checks.yml). About 7 minutes on a public
        # repository's 4-core runner; give a private repository's 2-core runner
        # room without letting a hung step bill for hours.
        timeout-minutes: 45
        env:
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Runtime policy: supported Node LTS majors intentionally follow
            # their latest security patch; Deno and action code are exact.
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Dependency audit (high or critical = fail)
              # High/critical fails, except dated, reasoned entries for advisories
              # with no fixed release (scripts/audit-gate.mjs); expired entries fail.
              run: node scripts/audit-gate.mjs

            - name: Complete dependency tree
              run: npm ls --all

            # Two-way hygiene: dead-declared prod deps AND phantom imports
            # (undeclared packages riding hoisted trees — removing an
            # unrelated dep breaks the build, as @turf/line-intersect proved
            # 2026-08-03). Allowlists live in the script.
            - name: Dependency hygiene (dead + phantom)
              run: node scripts/check-deps.mjs

            - name: Public beta source contract
              run: npm run check:beta:source

            - name: Public beta release configuration
              run: npm run check:beta

            # Migration hygiene, including SECURITY DEFINER search_path pinning
            # and explicit EXECUTE grants. A definer function that inherits the
            # default EXECUTE TO PUBLIC is reachable with the anon key that
            # ships in the web bundle — that is how user_display_name came to
            # return real names out of auth.users to anonymous callers. The
            # lint script includes this audit, so run it once rather than
            # spending CI time on a duplicate migration pass.
            - name: Lint + migration audit
              run: npm run lint

            - name: Route registry audit
              run: npm run lint:routes

            - name: Formatting contract
              run: npm run format:check

            # The Pi runs copies of the phone's router engine and collision
            # rule (pi-cache/src/routerEngine, pi-cache/src/collisionRule), and
            # each sync script's --check fails when its copy has drifted. The
            # router's needs the root prettier, which the pi-cache job does not
            # install, so until 126-05 it ran nowhere and the Pi's router lagged
            # the phone's by a whole engine. On a failure, run the script it
            # names (no --check) and commit the result.
            - name: Pi router engine mirror in sync
              run: node pi-cache/scripts/sync-router-engine.mjs --check

            - name: Pi collision rule mirror in sync
              run: node pi-cache/scripts/sync-collision-rule.mjs --check

            - name: Pi instrument, wake, radar and weather wire mirrors in sync
              run: |
                  node pi-cache/scripts/sync-signalk-protocol.mjs --check
                  node pi-cache/scripts/sync-wake-rule.mjs --check
                  node pi-cache/scripts/sync-radar-target.mjs --check
                  node pi-cache/scripts/sync-weather-position.mjs --check

            # The chart vault (Pi update 3, 127-C-d) runs a copy of the o-charts
            # SENC parser (pi-cache/src/sencEngine) from tools/senc-extractor.
            - name: Pi senc engine mirror in sync
              run: node pi-cache/scripts/sync-senc-engine.mjs --check

            - name: TypeScript type check
              run: npx tsc --noEmit

            # The edge tier runs on Deno, so tsc cannot see it — tsconfig
            # excludes supabase/** because its URL imports are unresolvable to
            # Node's resolver. That exclusion, plus an eslint ignore and no
            # Deno step, meant 20.4k LOC across 47 functions had no static
            # checking of any kind. Turning this on found 48 real type errors,
            # 27 of them reading columns off supabase-js's error branch.
            - name: Setup Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
              with:
                  # Exact locally validated stable release; action itself is
                  # independently pinned above.
                  deno-version: v2.9.4

            - name: Edge function formatting
              run: deno fmt --check supabase/functions

            - name: Edge function type check
              working-directory: supabase/functions
              run: deno check */index.ts

            - name: Edge function behavior tests
              working-directory: supabase/functions
              run: |
                  deno test */*_test.ts
                  deno test --no-config --no-lock --no-remote --deny-net \
                    --allow-read=send-push,_shared,../../utils \
                    --import-map=send-push/testing/import-map.json \
                    --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,APNS_KEY_ID,APNS_TEAM_ID,APNS_KEY_P8,APNS_PRODUCTION,APNS_CRITICAL_ALERTS_ENABLED,APNS_BUNDLE_ID \
                    send-push/testing/handler.case.ts

            - name: Public marine catalogue pipeline regressions
              run: python3 -m unittest discover -s scripts/marine-catalogue -p 'test_*.py'

            # The full unit suite runs nightly (full-checks.yml). These few seconds
            # of guards run on every push: the chart-licence guard (licensed chart
            # data must never be committed, private repository or not) and the
            # release contracts that pin this CI and the marine data path.
            - name: Guard tests (chart licence and release contracts)
              run: >-
                  npx vitest run tests/noProtectedChartData.test.ts tests/retiredChartFixtures.ledger.test.ts
                  tests/MarineReleaseSourceGates.test.ts tests/PublicBetaReleaseGateContract.test.ts
                  tests/ReleaseAssetProxy.test.ts

            - name: Build
              # Keep CI on the same production path used for releases. This
              # includes the pre/post-build client-secret scans in package.json.
              # SENTRY_SOURCEMAPS=1 emits HIDDEN maps that the next step uploads
              # and then deletes — they must be gone before any dist check runs.
              env:
                  SENTRY_SOURCEMAPS: '1'
                  VITE_APP_BUILD: ${{ vars.VITE_APP_BUILD }}
              run: npm run build

            - name: Upload hidden source maps to Sentry, then delete them
              # Skips the upload (exit 0) when SENTRY_AUTH_TOKEN is not set;
              # deletes the maps regardless so dist never carries source.
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
                  VITE_APP_BUILD: ${{ vars.VITE_APP_BUILD }}
              run: npm run sourcemaps:upload

            - name: Verify production preview routes and artifacts
              run: npm run check:web-release

            - name: Bundle size check
              run: npm run check:bundle

            - name: Install Lighthouse browser
              run: npx puppeteer browsers install chrome

            - name: Run Lighthouse audit
              id: lighthouse-audit
              timeout-minutes: 5
              run: node scripts/run-lighthouse-audit.mjs

            # A disclaimer-only audit passes every budget, so run this even when
            # the audit step reports a performance-budget failure. That proves
            # which document produced the report before anyone interprets it.
            - name: Assert Lighthouse audited the application shell
              if: ${{ always() && steps.lighthouse-audit.outcome != 'skipped' }}
              run: node scripts/assert-lighthouse-audited-app.mjs

            - name: Upload Lighthouse report
              if: ${{ always() && steps.lighthouse-audit.outcome != 'skipped' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: lighthouse-report
                  path: .lighthouseci/
                  retention-days: 7
                  include-hidden-files: true
                  if-no-files-found: error
