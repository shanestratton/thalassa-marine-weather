name: Build 132 focused regression validation

on:
    push:
        branches: ['codex/build-132-focused-validation']
        paths: ['.github/workflows/validate-build-132-fixes.yml']

permissions:
    contents: read

concurrency:
    group: build-132-focused-fixes
    cancel-in-progress: false

env:
    CI: 'true'
    HUSKY: '0'
    NODE_OPTIONS: --max-old-space-size=4096
    PUPPETEER_SKIP_DOWNLOAD: 'true'
    VITE_APP_BUILD: '132'
    VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
    VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
    VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}

jobs:
    focused:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: '6ae2e9490aeba222821efb49129b3e21a9a1ca0b'
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: npm
            - name: Preserve exact build 132 candidate and release history
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "6ae2e9490aeba222821efb49129b3e21a9a1ca0b"
                  git merge-base --is-ancestor 9922cfd729c4e19491cc4c5e87f56362922e131d HEAD
                  git merge-base --is-ancestor b8ef21d96a699a240b0378db7d7fcdc0e93810cd HEAD
                  git merge-base --is-ancestor 407dcf298571a1d504d80c54f6ee268d1fbc18a6 HEAD
                  git merge-base --is-ancestor bda4b58c5f948a6ba257b120659b5bc6b2f7d823 HEAD
                  git merge-base --is-ancestor 3fcbcead875a6c202a01ac4eb46aa55cf58cf07e HEAD
            - run: npm ci
            - name: Daylight and trace regression tests
              run: npx vitest run tests/DisplayModeCoverage.test.ts tests/IsobarLayerSetup.test.ts tests/TraceLayerPromotion.test.ts
            - name: Types, focused lint and formatting
              run: |
                  set -euo pipefail
                  npx tsc --noEmit
                  npx eslint components/map/isobarLayerSetup.ts tests/TraceLayerPromotion.test.ts
                  npx prettier --check components/map/isobarLayerSetup.ts tests/TraceLayerPromotion.test.ts
            - name: Install both browsers
              run: npx playwright install --with-deps chromium webkit
            - name: Complete desk-map coverage in both engines, no retries
              run: npx playwright test --config playwright.keyboard.config.ts browser-tests/desk-map-light.spec.ts --retries=0
            - name: Repeat the failing WebKit phone case and alarm flake, no retries
              run: npx playwright test --config playwright.keyboard.config.ts --project=webkit browser-tests/desk-map-light.spec.ts browser-tests/anchor-antenna-layout.spec.ts --grep '390 × 844, wide fonts|the many note fits' --repeat-each=5 --retries=0 --workers=1
            - name: Preserve browser evidence
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build132-focused-failures
                  path: test-results/
                  retention-days: 7
