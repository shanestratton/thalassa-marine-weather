name: Build141 bounded sharper satellite real-source proof
on:
  push:
    branches:
      - codex/build-141-satellite-source-proof
    paths:
      - .github/workflows/sharper-satellite-source-proof.yml
permissions:
  contents: read
jobs:
  observed-source:
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 5f9da29ac3fbc86003bb40cbf9de073c22860fba
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Require exact source
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f9da29ac3fbc86003bb40cbf9de073c22860fba
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install existing locked source-proof tools without lifecycle scripts
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record exact source and tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/satellite141-control"
          git rev-parse HEAD > "$RUNNER_TEMP/satellite141-control/SOURCE_SHA.txt"
          node --version > "$RUNNER_TEMP/satellite141-control/NODE_VERSION.txt"
          npm ls --depth=0 tsx fast-png > "$RUNNER_TEMP/satellite141-control/TOOLS.txt"
          sha256sum package.json package-lock.json scripts/prove-sharper-satellite-source.mjs .github/workflows/sharper-satellite-source-proof.yml services/weather/satelliteViewContract.ts services/weather/satelliteViewBytes.ts services/weather/api/cmemsGridTrust.ts services/weather/api/marineManifestContract.ts services/native/apiBase.ts utils/createLogger.ts api/satellite-view.ts tests/SatelliteSourceProof141.test.ts docs/build141/sharper-satellite-source-proof.md > "$RUNNER_TEMP/satellite141-control/SHA256SUMS"
      - name: One reviewed sequential bounded real-provider observation
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx scripts/prove-sharper-satellite-source.mjs --read-reviewed-sources "$RUNNER_TEMP/satellite141-source" 2>&1 | tee "$RUNNER_TEMP/satellite141-control/PROOF.txt"
      - name: Preserve actual success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build141-sharper-satellite-real-source-proof
          path: |
            ${{ runner.temp }}/satellite141-source/
            ${{ runner.temp }}/satellite141-control/
          retention-days: 7
          if-no-files-found: error
