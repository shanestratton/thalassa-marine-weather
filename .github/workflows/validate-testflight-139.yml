          node pi-cache/scripts/sync-collision-rule.mjs --check
          node pi-cache/scripts/sync-senc-engine.mjs --check
          node pi-cache/scripts/sync-lookahead-rule.mjs --check
          node pi-cache/scripts/sync-offline-weather-sources.mjs --check
          node pi-cache/scripts/sync-polar-rule.mjs --check
          node pi-cache/scripts/sync-wake-rule.mjs --check
          node pi-cache/scripts/sync-radar-target.mjs --check
          node pi-cache/scripts/sync-weather-position.mjs --check
          node pi-cache/scripts/sync-anchor-zone.mjs --check
          node pi-cache/scripts/sync-noaa-edition-policy.mjs --check
