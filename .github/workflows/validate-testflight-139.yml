          NODE
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Edge formatting, types and all behavior tests
        run: |
          set -euo pipefail
          deno fmt --check supabase/functions
          cd supabase/functions
          deno check */index.ts
          deno test */*_test.ts
      - name: Network-denied actual send-push handler cases
        working-directory: supabase/functions
        run: |
