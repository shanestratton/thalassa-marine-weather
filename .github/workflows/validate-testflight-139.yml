name: Thalassa 139 complete release validation

# Validation ONLY. No Apple keys, signing, upload, deployment or source writes.
# Exact source preserves132–138; native guard admits four numbers and two reviewed compiled Watch display files.
# No R2/provider access: publisher tests use fictional local stores. No recurring jobs.
# The optional retained-public-chart browser case requires an external reviewed artifact;
# its previous local proof is separate from the required synthetic package CI cases.
on:
  push:
    branches: ["codex/build-139-full-validation"]
    paths: [".github/workflows/validate-testflight-139.yml"]

permissions:
  contents: read

concurrency:
  group: thalassa-139-complete-validation
  cancel-in-progress: false

env:
  CANDIDATE_SHA: "e28dc0c136e8a45ab5aa1cc0e3d1ce8fd3a67334"
  PREVIOUS138_SHA: "8e6edf36a0c0514c252c347b68e7bb86cc7e0da9"
  CI: "true"
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=4096
  PUPPETEER_SKIP_DOWNLOAD: "true"
  VITE_APP_BUILD: "139"
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
  VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
  VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}

jobs:
  full:
    name: full (${{ matrix.suite }})
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            unit-coverage,
            two-browser-e2e,
            keyboard-1,
            keyboard-2,
            keyboard-3,
            keyboard-pixel,
            plan-your-day,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "e28dc0c136e8a45ab5aa1cc0e3d1ce8fd3a67334"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact source and all four build numbers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor c14828e1f0180fcdc6f59b7080fa8ab8e5a52a11 HEAD
          git merge-base --is-ancestor b8ef21d96a699a240b0378db7d7fcdc0e93810cd HEAD
          git merge-base --is-ancestor 407dcf298571a1d504d80c54f6ee268d1fbc18a6 HEAD
          git merge-base --is-ancestor bda4b58c5f948a6ba257b120659b5bc6b2f7d823 HEAD
          git merge-base --is-ancestor 3fcbcead875a6c202a01ac4eb46aa55cf58cf07e HEAD
          git merge-base --is-ancestor a9372b33c967d79d8676e9bb3564b68c794cc33b HEAD
          git merge-base --is-ancestor 9c0d9f2f2e5ca3a00226bc023b44a850e3666225 HEAD
          git merge-base --is-ancestor 4d22c003bb5493b3573b1d0f394a5a3dc74f4b07 HEAD
          git merge-base --is-ancestor 5eebfed3280c57b51aacbe3fd665ebc5c25adf51 HEAD
          git merge-base --is-ancestor 08ede95ed8399e476ed1e7285ebe1f3e8775e0c5 HEAD
          git merge-base --is-ancestor b6fdb1626cec1d850e7f8d2f3f3df88921c34d5c HEAD
          git merge-base --is-ancestor 8e6edf36a0c0514c252c347b68e7bb86cc7e0da9 HEAD
          git merge-base --is-ancestor 4d22c003bb5493b3573b1d0f394a5a3dc74f4b07 HEAD
          git merge-base --is-ancestor 572aaa220277e6b252657f59d1cdf2caebe864d6 HEAD
          git merge-base --is-ancestor 891c97ee448c25623312fcae5ddc6a23c1e43782 HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  
                  export const NATIVE_BASE138 = '8e6edf36a0c0514c252c347b68e7bb86cc7e0da9';
                  export const NATIVE_PROJECT139 = 'ios/App/App.xcodeproj/project.pbxproj';
                  export const WATCH_FILES139 = Object.freeze({
                      'ios/App/ThalassaWatch Watch App/Models/AnchorSnapshot.swift':
                          'a528ca73ce74e7a614caf5eb282af6e733077e4780393b6bfe670cce3786587a',
                      'ios/App/ThalassaWatch Watch App/Views/AnchorWatchView.swift':
                          '356b06d7ebe9ea91b1f045409661e0af23f69bafde7fee1930bfa363a95d69fa',
                  });
                  const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
                  
                  /** Reproduce only the six existing entry relocations measured after CocoaPods sync.
                   * This transforms the immutable138 baseline; the candidate itself is never
                   * normalized and must match every resulting byte exactly. */
                  export function expectedNativeProject139(oldText) {
                      let text = oldText.replaceAll('CURRENT_PROJECT_VERSION = 138;', 'CURRENT_PROJECT_VERSION = 139;');
                      for (const [section, suffix] of [
                          ['PBXBuildFile', '1'],
                          ['PBXFileReference', '2'],
                      ]) {
                          const begin = `/* Begin ${section} section */`,
                              end = `/* End ${section} section */`;
                          const start = text.indexOf(begin),
                              finish = text.indexOf(end);
                          assert.ok(start >= 0 && finish > start && text.indexOf(begin, start + 1) < 0);
                          const body = text.slice(start, finish),
                              lines = body.split('\n');
                          const ids = [
                              `AA0011B1AAAA11B10000000${suffix}`,
                              `AA0011B2AAAA11B20000000${suffix}`,
                              `B3A10001202608040000000${suffix}`,
                          ];
                          const moved = ids.map((id) => {
                              const matching = lines.filter((line) => line.startsWith(`\t\t${id} /*`));
                              assert.equal(matching.length, 1, 'Expected one original NFC/privacy entry');
                              return matching[0];
                          });
                          const first = lines.indexOf(moved[0]);
                          assert.deepEqual(lines.slice(first, first + 3), moved, 'Unexpected138 NFC/privacy ordering');
                          const remaining = lines.filter((line) => !moved.includes(line));
                          const anchors = remaining
                              .map((line, index) => (line.startsWith(`\t\tAA000039AAAA00390000000${suffix} /*`) ? index : -1))
                              .filter((index) => index >= 0);
                          assert.equal(anchors.length, 1, 'Expected original NmeaUdpRebindGate entry');
                          remaining.splice(anchors[0] + 1, 0, ...moved);
                          text = text.slice(0, start) + remaining.join('\n') + text.slice(finish);
                      }
                      return Buffer.from(text);
                  }
                  
                  /** Exact native policy, also reusable by the separately unarmed release draft.
                   * The two reviewed files belong to the synchronized compiled Watch target.
                   * The historical ios/WatchApp tree has no exception. */
                  export function assertNative139(read = readFileSync, git = execFileSync) {
                      const names = git('git', ['diff', '--name-only', '--no-renames', NATIVE_BASE138, 'HEAD', '--', 'ios/'], {
                          encoding: 'utf8',
                      })
                          .trim()
                          .split('\n')
                          .filter(Boolean);
                      assert.deepEqual(names, [NATIVE_PROJECT139, ...Object.keys(WATCH_FILES139)]);
                      const oldText = git('git', ['show', `${NATIVE_BASE138}:${NATIVE_PROJECT139}`]).toString('utf8');
                      const oldBuilds = [...oldText.matchAll(/CURRENT_PROJECT_VERSION = (\d+);/g)];
                      assert.equal(oldBuilds.length, 4, 'Expected exactly four138 configurations');
                      assert.ok(
                          oldBuilds.every((m) => m[1] === '138'),
                          'Unexpected138 identity',
                      );
                      const expected = expectedNativeProject139(oldText);
                      assert.ok(
                          read(NATIVE_PROJECT139).equals(expected),
                          'Native project exceeds four build declarations and six reviewed entry relocations',
                      );
                      for (const [file, hash] of Object.entries(WATCH_FILES139))
                          assert.equal(digest(read(file)), hash, `Unreviewed Watch source: ${file}`);
                      git('git', ['diff', '--exit-code', 'HEAD', '--', 'ios/'], { stdio: 'pipe' });
                      return {
                          base: NATIVE_BASE138,
                          changedFiles: names,
                          buildChanges: 4,
                          reviewedEntryRelocations: 6,
                          projectSha256: digest(expected),
                          appBuild: 139,
                          watchFiles: WATCH_FILES139,
                      };
                  }
                  assertNative139();
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const matches=[...readFileSync('ios/App/App.xcodeproj/project.pbxproj','utf8').matchAll(/CURRENT_PROJECT_VERSION = (\d+);/g)];
          if(matches.length!==4 || matches.some(m=>m[1]!=='139')) throw new Error('Expected four build-139 configurations');
          if(JSON.parse(readFileSync('package.json','utf8')).version!=='1.2.0') throw new Error('Unexpected marketing version');
          NODE
          echo "Exact release candidate: $CANDIDATE_SHA; iOS 1.2.0 (139)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run check:beta:source
      - name: All unit tests with coverage
        if: matrix.suite == 'unit-coverage'
        run: npx vitest run --reporter=dot --reporter=github-actions --coverage
      - name: Build production app for both browser engines
        if: matrix.suite == 'two-browser-e2e'
        run: |
          set -euo pipefail
          npm run check:beta
          GITHUB_SHA="$(git rev-parse HEAD)" npm run build
      - name: Install both browser engines
        if: matrix.suite != 'unit-coverage'
        run: npx playwright install --with-deps chromium webkit
      - name: All Chromium and mobile Safari E2E tests
        if: matrix.suite == 'two-browser-e2e'
        run: npx playwright test --project=chromium --project=mobile-safari
      - name: Complete bounded NOAA package browser checks, both engines
        if: matrix.suite == 'two-browser-e2e'
        run: |
          set -euo pipefail
          npx playwright test --config playwright.noaa-package.config.ts
          echo "Required fictional package cold-start, renderer, inshore/tracer/leads, tamper and account-isolation checks completed in Chromium and WebKit. Optional external retained-chart proof is reported separately; no provider download is performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Complete packed-data synthetic entry proofs in both engines
        if: matrix.suite == 'two-browser-e2e'
        run: npx playwright test --config playwright.inert-ui-data139.config.ts
      - name: Complete packed-data actual release entry proofs in both engines
        if: matrix.suite == 'two-browser-e2e'
        env:
          INERT_UI_RELEASE_ARTIFACT: "1"
        run: ACTUAL_INERT_DIST="$PWD/dist" npx playwright test --config playwright.inert-ui-artifact139.config.ts
      - name: Complete keyboard, daylight and split-pane shard
        if: startsWith(matrix.suite, 'keyboard-') && matrix.suite != 'keyboard-pixel'
        env:
          SUITE: ${{ matrix.suite }}
        run: npx playwright test --config playwright.keyboard.config.ts --shard="${SUITE#keyboard-}/3" --grep-invert @pixel
      - name: Wind pixel checks, one worker
        if: matrix.suite == 'keyboard-pixel'
        run: npx playwright test --config playwright.keyboard.config.ts --grep @pixel --workers=1 --retries=1
      - name: Complete Plan Your Day fit suite
        if: matrix.suite == 'plan-your-day'
        run: npx playwright test --config playwright.day-planner.config.ts
      - name: Record successful full suite
        env:
          SUITE: ${{ matrix.suite }}
        run: echo "$SUITE PASSED on $CANDIDATE_SHA, build 139" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve unit coverage
        if: always() && matrix.suite == 'unit-coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build139-corrected-coverage
          path: coverage/
          retention-days: 7
      - name: Preserve browser failure evidence
        if: failure() && matrix.suite != 'unit-coverage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build139-corrected-failure-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quick:
    name: quick release gates
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: relay_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      engine-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: engine-fixture-only-password
          POSTGRES_DB: engine_fixture
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "e28dc0c136e8a45ab5aa1cc0e3d1ce8fd3a67334"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact application commit and preserved release ancestors
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor c14828e1f0180fcdc6f59b7080fa8ab8e5a52a11 HEAD
          git merge-base --is-ancestor b8ef21d96a699a240b0378db7d7fcdc0e93810cd HEAD
          git merge-base --is-ancestor 407dcf298571a1d504d80c54f6ee268d1fbc18a6 HEAD
          git merge-base --is-ancestor bda4b58c5f948a6ba257b120659b5bc6b2f7d823 HEAD
          git merge-base --is-ancestor 3fcbcead875a6c202a01ac4eb46aa55cf58cf07e HEAD
          git merge-base --is-ancestor a9372b33c967d79d8676e9bb3564b68c794cc33b HEAD
          git merge-base --is-ancestor 9c0d9f2f2e5ca3a00226bc023b44a850e3666225 HEAD
          git merge-base --is-ancestor 4d22c003bb5493b3573b1d0f394a5a3dc74f4b07 HEAD
          git merge-base --is-ancestor 5eebfed3280c57b51aacbe3fd665ebc5c25adf51 HEAD
          git merge-base --is-ancestor 08ede95ed8399e476ed1e7285ebe1f3e8775e0c5 HEAD
          git merge-base --is-ancestor b6fdb1626cec1d850e7f8d2f3f3df88921c34d5c HEAD
          git merge-base --is-ancestor 8e6edf36a0c0514c252c347b68e7bb86cc7e0da9 HEAD
          git merge-base --is-ancestor 572aaa220277e6b252657f59d1cdf2caebe864d6 HEAD
          git merge-base --is-ancestor 891c97ee448c25623312fcae5ddc6a23c1e43782 HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  
                  export const NATIVE_BASE138 = '8e6edf36a0c0514c252c347b68e7bb86cc7e0da9';
                  export const NATIVE_PROJECT139 = 'ios/App/App.xcodeproj/project.pbxproj';
                  export const WATCH_FILES139 = Object.freeze({
                      'ios/App/ThalassaWatch Watch App/Models/AnchorSnapshot.swift':
                          'a528ca73ce74e7a614caf5eb282af6e733077e4780393b6bfe670cce3786587a',
                      'ios/App/ThalassaWatch Watch App/Views/AnchorWatchView.swift':
                          '356b06d7ebe9ea91b1f045409661e0af23f69bafde7fee1930bfa363a95d69fa',
                  });
                  const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
                  
                  /** Reproduce only the six existing entry relocations measured after CocoaPods sync.
                   * This transforms the immutable138 baseline; the candidate itself is never
                   * normalized and must match every resulting byte exactly. */
                  export function expectedNativeProject139(oldText) {
                      let text = oldText.replaceAll('CURRENT_PROJECT_VERSION = 138;', 'CURRENT_PROJECT_VERSION = 139;');
                      for (const [section, suffix] of [
                          ['PBXBuildFile', '1'],
                          ['PBXFileReference', '2'],
                      ]) {
                          const begin = `/* Begin ${section} section */`,
                              end = `/* End ${section} section */`;
                          const start = text.indexOf(begin),
                              finish = text.indexOf(end);
                          assert.ok(start >= 0 && finish > start && text.indexOf(begin, start + 1) < 0);
                          const body = text.slice(start, finish),
                              lines = body.split('\n');
                          const ids = [
                              `AA0011B1AAAA11B10000000${suffix}`,
                              `AA0011B2AAAA11B20000000${suffix}`,
                              `B3A10001202608040000000${suffix}`,
                          ];
                          const moved = ids.map((id) => {
                              const matching = lines.filter((line) => line.startsWith(`\t\t${id} /*`));
                              assert.equal(matching.length, 1, 'Expected one original NFC/privacy entry');
                              return matching[0];
                          });
                          const first = lines.indexOf(moved[0]);
                          assert.deepEqual(lines.slice(first, first + 3), moved, 'Unexpected138 NFC/privacy ordering');
                          const remaining = lines.filter((line) => !moved.includes(line));
                          const anchors = remaining
                              .map((line, index) => (line.startsWith(`\t\tAA000039AAAA00390000000${suffix} /*`) ? index : -1))
                              .filter((index) => index >= 0);
                          assert.equal(anchors.length, 1, 'Expected original NmeaUdpRebindGate entry');
                          remaining.splice(anchors[0] + 1, 0, ...moved);
                          text = text.slice(0, start) + remaining.join('\n') + text.slice(finish);
                      }
                      return Buffer.from(text);
                  }
                  
                  /** Exact native policy, also reusable by the separately unarmed release draft.
                   * The two reviewed files belong to the synchronized compiled Watch target.
                   * The historical ios/WatchApp tree has no exception. */
                  export function assertNative139(read = readFileSync, git = execFileSync) {
                      const names = git('git', ['diff', '--name-only', '--no-renames', NATIVE_BASE138, 'HEAD', '--', 'ios/'], {
                          encoding: 'utf8',
                      })
                          .trim()
                          .split('\n')
                          .filter(Boolean);
                      assert.deepEqual(names, [NATIVE_PROJECT139, ...Object.keys(WATCH_FILES139)]);
                      const oldText = git('git', ['show', `${NATIVE_BASE138}:${NATIVE_PROJECT139}`]).toString('utf8');
                      const oldBuilds = [...oldText.matchAll(/CURRENT_PROJECT_VERSION = (\d+);/g)];
                      assert.equal(oldBuilds.length, 4, 'Expected exactly four138 configurations');
                      assert.ok(
                          oldBuilds.every((m) => m[1] === '138'),
                          'Unexpected138 identity',
                      );
                      const expected = expectedNativeProject139(oldText);
                      assert.ok(
                          read(NATIVE_PROJECT139).equals(expected),
                          'Native project exceeds four build declarations and six reviewed entry relocations',
                      );
                      for (const [file, hash] of Object.entries(WATCH_FILES139))
                          assert.equal(digest(read(file)), hash, `Unreviewed Watch source: ${file}`);
                      git('git', ['diff', '--exit-code', 'HEAD', '--', 'ios/'], { stdio: 'pipe' });
                      return {
                          base: NATIVE_BASE138,
                          changedFiles: names,
                          buildChanges: 4,
                          reviewedEntryRelocations: 6,
                          projectSha256: digest(expected),
                          appBuild: 139,
                          watchFiles: WATCH_FILES139,
                      };
                  }
                  assertNative139();
          NODE
      - name: Ephemeral PostgreSQL underway privacy, capability and RLS replay
        env:
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/underway-sql-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/underway-sql-replay/SOURCE_SHA.txt"
          sha256sum tests/sql/underway-alarm-replay.sql supabase/migrations/20261010120000_pi_alarm_events.sql supabase/held-migrations/20261015220000_underway_alarm_kinds.sql > "$RUNNER_TEMP/underway-sql-replay/SHA256SUMS"
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d relay_fixture -v ON_ERROR_STOP=1 -f tests/sql/underway-alarm-replay.sql 2>&1 | tee "$RUNNER_TEMP/underway-sql-replay/REPLAY.txt"
      - name: Preserve ephemeral PostgreSQL replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build139-underway-sql-replay
          path: ${{ runner.temp }}/underway-sql-replay/
          retention-days: 7
          if-no-files-found: error
      - name: Ephemeral AIS PostGIS privacy, fleet budget and concurrency replay
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: ais_fixture
          PGPASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ais-sql-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/ais-sql-replay/SOURCE_SHA.txt"
          sha256sum tests/sql/ais-fleet-replay.sql tests/sql/ais-fleet-concurrency.mjs supabase/migrations/20260318080000_ais_vessels.sql supabase/migrations/20261016072703_ais_fleet_budget.sql > "$RUNNER_TEMP/ais-sql-replay/SHA256SUMS"
          createdb --maintenance-db=postgres ais_fixture
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/ais-fleet-replay.sql 2>&1 | tee "$RUNNER_TEMP/ais-sql-replay/REPLAY.txt"
          node tests/sql/ais-fleet-concurrency.mjs 2>&1 | tee "$RUNNER_TEMP/ais-sql-replay/CONCURRENCY.txt"
      - name: Preserve ephemeral AIS PostgreSQL replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build139-ais-sql-replay
          path: ${{ runner.temp }}/ais-sql-replay/
          retention-days: 7
          if-no-files-found: error
      - name: Ephemeral engine-hour confirmation and concurrency replay
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGDATABASE: engine_fixture
          PGPASSWORD: engine-fixture-only-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine-sql-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/engine-sql-replay/SOURCE_SHA.txt"
          sha256sum tests/sql/engine-hours-confirmation.sql tests/sql/engine-hours-race.py supabase/migrations/20261016175740_confirmed_voyage_engine_hours.sql > "$RUNNER_TEMP/engine-sql-replay/SHA256SUMS"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/engine-hours-confirmation.sql 2>&1 | tee "$RUNNER_TEMP/engine-sql-replay/REPLAY.txt"
          python3 tests/sql/engine-hours-race.py 2>&1 | tee "$RUNNER_TEMP/engine-sql-replay/CONCURRENCY.txt"
      - name: Preserve ephemeral engine-hour replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build139-engine-sql-replay
          path: ${{ runner.temp }}/engine-sql-replay/
          retention-days: 7
          if-no-files-found: error
      - run: npm ci
      - name: Dependency audits and both release gates
        run: |
          set -euo pipefail
          node scripts/audit-gate.mjs
          npm ls --all
          node scripts/check-deps.mjs
          npm run check:beta:source
          npm run check:beta
      - name: Lint, migration, route, formatting, mirror and type checks
        run: |
