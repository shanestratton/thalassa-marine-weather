name: Hosted Deploy Smoke Test

on:
    deployment_status:

permissions:
    contents: read
    deployments: read

jobs:
    authorize:
        name: Authorize Hosted Candidate
        runs-on: ubuntu-24.04
        timeout-minutes: 3
        outputs:
            eligible: ${{ steps.candidate.outputs.eligible }}
            candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
        # Vercel labels branch deployments Preview and the default-branch
        # deployment Production. Admit only those two exact Vercel labels;
        # the old `!= 'production'` guard also matched the retired Railway
        # worker environment and smoke-tested its project dashboard.
        if: >
            github.event.deployment_status.state == 'success' &&
            (github.event.deployment_status.environment == 'Preview' ||
             github.event.deployment_status.environment == 'Production') &&
            github.actor == 'vercel[bot]' &&
            github.event.deployment.creator.login == 'vercel[bot]'

        steps:
            # Deployment-status events can originate from any deployment.
            # Always load the trusted default-branch workflow/test code first,
            # then admit only a deployment of the exact current default-branch SHA
            # before any secret-bearing step is allowed to run.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}

            - name: Authorize current default-branch candidate
              id: candidate
              env:
                  DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
              run: |
                  candidate_sha="$(git rev-parse HEAD)"
                  echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
                  if [[ "$DEPLOYMENT_SHA" == "$candidate_sha" ]]; then
                      echo "eligible=true" >> "$GITHUB_OUTPUT"
                      echo "Hosted deployment matches the current default-branch candidate."
                  else
                      echo "eligible=false" >> "$GITHUB_OUTPUT"
                      echo "Skipping deployment for non-candidate SHA $DEPLOYMENT_SHA."
                  fi

    smoke:
        name: Smoke Test Hosted Candidate
        needs: authorize
        if: needs.authorize.outputs.eligible == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: Preview

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.authorize.outputs.candidate_sha }}

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright
              run: npx playwright install chromium --with-deps

            - name: Run smoke tests against hosted candidate
              env:
                  PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
                  REQUIRE_HOSTED_PREVIEW: 'true'
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: |
                  echo "Smoke testing: $PREVIEW_URL"
                  npm run check:web-release -- --hosted "$PREVIEW_URL"
                  npx playwright test e2e/smoke.spec.ts --project=chromium
              # Two independently validated generations can be several hundred
              # megabytes; verifier concurrency remains fixed at two.
              timeout-minutes: 12

            - name: Upload smoke test artifacts on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: smoke-test-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
