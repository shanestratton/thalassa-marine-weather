name: AROME142 one conditional constant original native pilot
on:
    push:
        branches: [codex/build-142-arome-constant-original-proof]
        paths: [.github/workflows/arome142-constant-original-proof.yml]
permissions:
    contents: read
concurrency:
    group: arome142-constant-original-conditional-v1
    cancel-in-progress: false
jobs:
    constant:
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/build-142-arome-constant-original-proof' && github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            PROOF_SOURCE_SHA: cf21a611c6b22db62449bc1658e7ae8b931476be
            CONSTANT_CONTROLLER_SHA: 66969ef49ed50e283eeb47012dadcf86fe6cc1b3
            PYTHONDONTWRITEBYTECODE: '1'
            OPENBLAS_NUM_THREADS: '1'
            OMP_NUM_THREADS: '1'
        steps:
            - name: Checkout exact reviewed control
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  path: controls
                  fetch-depth: 0
                  persist-credentials: false
            - name: Checkout exact corrected scientific source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: cf21a611c6b22db62449bc1658e7ae8b931476be
                  path: source
                  persist-credentials: false
            - name: Set up proven Python3.11.15
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.11.15'
            - name: Set up proven Node24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
            - name: Admit one conditional original then decode offline
              shell: bash
              run: bash controls/ci/arome142-constant/run.sh
            - name: Preserve exact original and bounded evidence on every outcome
              if: always()
              shell: bash
              run: python controls/ci/arome142-constant/collect.py
            - name: Preserve constant pilot evidence without native packages
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: arome142-constant-native-${{ github.run_id }}
                  path: ${{ runner.temp }}/arome142-constant-artifact
                  if-no-files-found: error
                  retention-days: 14
