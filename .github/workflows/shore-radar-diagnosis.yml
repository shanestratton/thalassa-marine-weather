name: Shore radar fix validation

# Temporary validation branch, no signing secrets or app artifacts.
# Test the actual four-line commit, not a browser shim or a weakened test.
on:
    push:
        branches: ['codex/thalassa-radar-ci-diagnosis']
        paths: ['.github/workflows/shore-radar-diagnosis.yml']

permissions:
    contents: read

concurrency:
    group: shore-radar-ci-diagnosis
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            CI: 'true'
            HUSKY: '0'
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            NODE_OPTIONS: --max-old-space-size=4096
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: 7f4edee04c9d47351a48814139ef1fdfb27dc3e9
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium webkit
            - name: Validate formatting and pinned source
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = 7f4edee04c9d47351a48814139ef1fdfb27dc3e9
                  npx prettier --check components/anchor-watch/SwingCircleCanvas.tsx
                  mkdir -p "$RUNNER_TEMP/shore-radar-validation"
            - name: Original WebKit regression, 20 repetitions with no retries
              timeout-minutes: 4
              run: |
                  set -euo pipefail
                  npx playwright test --config playwright.keyboard.config.ts shore-watch-layout.spec.ts \
                      --grep 'draws her trail across the antimeridian' --project=webkit \
                      --repeat-each=20 --retries=0 --workers=1 --reporter=json \
                      --output "$RUNNER_TEMP/shore-radar-validation/webkit-output" \
                      > "$RUNNER_TEMP/shore-radar-validation/webkit.json"
                  echo '- Original WebKit Taveuni pixel regression: 20 repetitions passed, no retries; iPhone 13 remains at 3x.' >> "$GITHUB_STEP_SUMMARY"
            - name: Original Chromium regression, 10 repetitions with no retries
              timeout-minutes: 3
              run: |
                  set -euo pipefail
                  npx playwright test --config playwright.keyboard.config.ts shore-watch-layout.spec.ts \
                      --grep 'draws her trail across the antimeridian' --project=chromium \
                      --repeat-each=10 --retries=0 --workers=1 --reporter=json \
                      --output "$RUNNER_TEMP/shore-radar-validation/chromium-output" \
                      > "$RUNNER_TEMP/shore-radar-validation/chromium.json"
                  echo '- Original Chromium Taveuni pixel regression: 10 repetitions passed, no retries.' >> "$GITHUB_STEP_SUMMARY"
            - name: Removing only the fix must reproduce the original WebKit assertion
              timeout-minutes: 2
              shell: bash
              run: |
                  set -euo pipefail
                  target=components/anchor-watch/SwingCircleCanvas.tsx
                  cp "$target" "$RUNNER_TEMP/shore-radar-original.tsx"
                  trap 'cp "$RUNNER_TEMP/shore-radar-original.tsx" "$target"' EXIT
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path('components/anchor-watch/SwingCircleCanvas.tsx')
                  source = path.read_text()
                  needle = '            ctx.resetTransform();\n'
                  assert source.count(needle) == 1, 'Unexpected resetTransform occurrences'
                  path.write_text(source.replace(needle, ''))
                  PY
                  set +e
                  npx playwright test --config playwright.keyboard.config.ts shore-watch-layout.spec.ts \
                      --grep 'draws her trail across the antimeridian' --project=webkit \
                      --retries=0 --workers=1 --reporter=json \
                      --output "$RUNNER_TEMP/shore-radar-validation/negative-output" \
                      > "$RUNNER_TEMP/shore-radar-validation/negative.json"
                  result=$?
                  set -e
                  [ "$result" -ne 0 ] || { echo '::error::Negative control unexpectedly passed'; exit 1; }
                  python3 - <<'PY'
                  import json, os
                  from pathlib import Path
                  report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'shore-radar-validation/negative.json').read_text())
                  messages = []
                  def walk(value):
                      if isinstance(value, dict):
                          if isinstance(value.get('message'), str):
                              messages.append(value['message'])
                          for child in value.values():
                              walk(child)
                      elif isinstance(value, list):
                          for child in value:
                              walk(child)
                  walk(report)
                  assert report['stats']['unexpected'] == 1, 'Expected exactly one failed regression'
                  assert not report.get('errors'), 'Infrastructure errors invalidate the negative control'
                  assert any('the red N is read above the circle' in message for message in messages), 'Different failure: not the original radar regression'
                  print('Negative control reproduced the original red-N assertion with only resetTransform removed.')
                  PY
                  echo '- Negative control: removing only resetTransform reproduced the original WebKit red-N assertion.' >> "$GITHUB_STEP_SUMMARY"
                  echo '- This focused validation does not replace the full PR checks or real-device verification. No app upload occurred.' >> "$GITHUB_STEP_SUMMARY"
            - name: Save test reports and failure images only
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: shore-radar-fix-validation
                  path: ${{ runner.temp }}/shore-radar-validation/
                  retention-days: 3
                  if-no-files-found: warn
