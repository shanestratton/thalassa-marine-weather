name: LINZ MSI → Supabase

# Maritime NZ's navigational warnings page is gated by Cloudflare's JS
# challenge, which Deno fetch (Supabase edge functions) can't solve.
# This workflow runs Playwright in headless Chromium — which Cloudflare
# lets through — every 6 hours and writes the parsed warnings to the
# linz_warnings table. The proxy-linz-msi edge function then serves
# them in the same shape as the AMSA / UKHO proxies.

on:
    schedule:
        # Every 6 hours at HH:17 (offset to avoid the on-the-hour
        # GitHub-wide cron stampede).
        - cron: '17 */6 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: linz-msi-scrape
    # Queue a manual run behind an active scheduled run. Cancelling a
    # writer mid-upsert/cleanup would leave a partially refreshed set.
    cancel-in-progress: false

jobs:
    scrape:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # The secret-bearing writer runs only from reviewed master source,
        # including manual dispatches (whose selected ref may otherwise vary).
        if: github.ref == 'refs/heads/master'
        defaults:
            run:
                working-directory: scripts/linz-msi-scrape
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  # Node 22+ for the native WebSocket implementation —
                  # supabase-js v2 initialises its Realtime transport on
                  # createClient() and errors out on Node 20 without it.
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: scripts/linz-msi-scrape/package-lock.json

            - name: Re-allow user namespaces for Chromium's sandbox
              # The Ubuntu 24.04 runner image began enforcing AppArmor's
              # unprivileged-userns restriction (~2026-08-29), so Chromium
              # can no longer create its sandbox and Playwright dies at
              # launch ("No usable sandbox"). Lift the restriction rather
              # than passing --no-sandbox — the scraper deliberately keeps
              # Chromium sandboxed (see scrape.mjs launch options).
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - name: Install scraper deps
              run: npm ci

            - name: Audit scraper dependencies
              run: npm audit --audit-level=high

            - name: Verify scraper dependency tree
              run: npm ls --all

            - name: Verify parser and dry-run write boundary
              # Runs before secrets enter any step environment. The tests
              # exercise the parser safety bounds, browser env allowlist,
              # dry-run no-write path and mocked service-role persistence.
              run: npm test

            - name: Install Chromium for Playwright
              # --with-deps installs the OS-level libs (libnss3 et al.)
              # that headless Chromium needs on Ubuntu.
              run: npx --no-install playwright install chromium --with-deps

            - name: Scrape Maritime NZ and upsert to Supabase
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              run: node scrape.mjs

            - name: Upload page state on failure
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: linz-msi-debug-${{ github.run_id }}
                  path: /tmp/thalassa-linz-debug-*/*
                  if-no-files-found: ignore
                  retention-days: 7
