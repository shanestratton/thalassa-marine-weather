name: Build135 fixed-source wind pixel diagnostic

on:
    push:
        branches: [codex/build135-wind-proof]

permissions:
    contents: read

jobs:
    wind-pixels:
        if: >-
            github.repository == 'shanestratton/thalassa-marine-weather' &&
            github.ref == 'refs/heads/codex/build135-wind-proof' &&
            github.actor == github.repository_owner && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            CI: 'true'
            HUSKY: '0'
            NODE_OPTIONS: --max-old-space-size=4096
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            VITE_APP_BUILD: '135'
            VITE_MAPBOX_ACCESS_TOKEN: pk.fixture-only-synthetic-map
            VITE_SUPABASE_URL: https://fixture.example.test
            VITE_SUPABASE_ANON_KEY: fixture-anon-key
        steps:
            - name: Checkout exact reviewed diagnostic source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: bda54b11b9c49ccf41421d231c0ed5849518fd5f
                  persist-credentials: false
            - name: Verify exact source
              shell: bash
              run: test "$(git rev-parse HEAD)" = bda54b11b9c49ccf41421d231c0ed5849518fd5f
            - name: Set up reviewed Node runtime
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '24'
                  cache: npm
            - name: Install locked source dependencies
              run: npm ci
            - name: Install actual Linux Chromium and WebKit with runtime dependencies
              run: npx playwright install --with-deps chromium webkit
            - name: Verify original four pixels and native backing regression
              run: npx playwright test --config playwright.wind-proof.config.ts
            - name: Measure actual capped desktop and mobile wind fields in both browsers
              run: WIND_FIELD_PERFORMANCE=1 npx playwright test --config playwright.wind-proof.config.ts --grep performance --output test-results/wind-performance
            - name: Preserve screenshots, traces and original diagnostic metrics
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build135-wind-diagnostic-${{ github.run_id }}
                  path: |
                      test-results/wind-proof/
                      test-results/wind-performance/
                      playwright-report/
                  if-no-files-found: warn
                  retention-days: 7
