              run: |
                  echo "$BROWSER strict REVISED-CAPTURE repetitions: $PROOF_OUTCOME on $CANDIDATE_SHA. Eight original expect lines/full colour assertion blocks and 150s budget/profile unchanged; 3 repetitions/0 retries/no forced tracing or injection. Actual ON/OFF pair PNGs retained on success and failure. Focused proof only, not whole release or compositor-cause proof." >> "$GITHUB_STEP_SUMMARY"
            - name: Preserve JSON, source hash receipts and actual measured pair PNGs on success too
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build127-strict-batched-wind-${{ matrix.browser }}
