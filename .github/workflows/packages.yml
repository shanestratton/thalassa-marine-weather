name: Packages

# The separately deployed packages (AIS ingest worker, Deepgram proxy, Pi cache),
# each on its own lockfile and runtime. Moved from ci.yml in 2026-10 so they run
# when their own files change (and weekly), not on every push of the app.
on:
    push:
        branches: [master, main]
        paths:
            - '.github/workflows/packages.yml'
            - 'workers/ais-ingest/**'
            - 'cloudflare-worker/**'
            - 'pi-cache/**'
    pull_request:
        branches: [master, main]
        paths:
            - '.github/workflows/packages.yml'
            - 'workers/ais-ingest/**'
            - 'cloudflare-worker/**'
            - 'pi-cache/**'
    schedule:
        - cron: '53 16 * * 0'
    workflow_dispatch:

concurrency:
    group: packages-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Independently deployed production boundaries use their own lockfiles and
    # runtime floors. Separate jobs prevent root dependency hoisting or Node 24
    # from concealing drift in the environments these packages actually run.
    ais-ingest:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup AIS ingest runtime
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Matches workers/ais-ingest/Dockerfile.
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: workers/ais-ingest/package-lock.json

            - name: Install AIS ingest worker dependencies
              working-directory: workers/ais-ingest
              run: npm ci

            - name: Audit AIS ingest worker dependencies
              working-directory: workers/ais-ingest
              run: npm audit --audit-level=high

            - name: Verify AIS ingest worker dependency tree
              working-directory: workers/ais-ingest
              run: npm ls --all

            - name: Build AIS ingest worker
              working-directory: workers/ais-ingest
              run: npm run build

            - name: Test AIS ingest worker
              working-directory: workers/ais-ingest
              run: npm test

    deepgram-proxy:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Deepgram proxy toolchain
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: cloudflare-worker/package-lock.json

            - name: Install Deepgram proxy dependencies
              working-directory: cloudflare-worker
              run: npm ci

            - name: Audit Deepgram proxy dependencies
              working-directory: cloudflare-worker
              run: npm audit --audit-level=high

            - name: Verify Deepgram proxy dependency tree
              working-directory: cloudflare-worker
              run: npm ls --all

            - name: Type-check Deepgram proxy
              working-directory: cloudflare-worker
              run: ./node_modules/.bin/tsc --noEmit

    pi-cache:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Pi cache runtime
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  # Matches the NodeSource runtime installed by install.sh (22.x
                  # since 2026-09-10; the boat Pi runs Node 22.23.2).
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: pi-cache/package-lock.json

            - name: Install Pi cache dependencies
              working-directory: pi-cache
              run: npm ci

            - name: Audit Pi cache dependencies
              working-directory: pi-cache
              run: npm audit --audit-level=high

            - name: Verify Pi cache dependency tree
              working-directory: pi-cache
              run: npm ls --all

            - name: Build Pi cache
              working-directory: pi-cache
              run: npm run build

            - name: Test Pi cache
              working-directory: pi-cache
              run: npm test

            - name: Verify staged update plans and refusal boundaries
              working-directory: pi-cache
              run: node --test scripts/update5.test.mjs scripts/update6.test.mjs scripts/update7.test.mjs
