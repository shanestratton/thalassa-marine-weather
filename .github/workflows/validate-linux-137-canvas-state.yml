# Diagnostic only; final acceptance still requires the full layout/graphics suite and release matrix.
name: Thalassa 137 canvas state diagnostic only
on:
  push:
    branches:
      - codex/build-137-canvas-state
    paths:
      - .github/workflows/validate-linux-137-canvas-state.yml
permissions:
  contents: read
concurrency:
  group: thalassa-137-canvas-state
  cancel-in-progress: false
env:
  CANDIDATE_SHA: af2494c7bdcbb4b1fa8b0c4950f0319d4bce30a8
  CI: "true"
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=4096
  PUPPETEER_SKIP_DOWNLOAD: "true"
  VITE_APP_BUILD: "137"
  VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
  VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
  VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
  VITE_SENTRY_DSN: ""
jobs:
  linux-rendering:
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: af2494c7bdcbb4b1fa8b0c4950f0319d4bce30a8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Verify exact source and public fixture configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.VITE_APP_BUILD, '137');
          assert.equal(process.env.VITE_SUPABASE_URL, 'https://pcisdplnodrphauixcau.supabase.co');
          assert.ok(process.env.VITE_MAPBOX_ACCESS_TOKEN?.startsWith('pk.'));
          const key = process.env.VITE_SUPABASE_KEY ?? '';
          assert.ok(key && !key.startsWith('sb_secret_'));
          if (key.startsWith('eyJ')) assert.equal(JSON.parse(Buffer.from(key.split('.')[1], 'base64url')).role, 'anon');
          console.log('Exact source and public client configuration verified; no values printed.');
          NODE
      - run: npm ci
      - id: install
        name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Two original-guard WebKit canvas diagnostic cases
        run: npx playwright test --config playwright.keyboard.config.ts browser-tests/tide-footer-layout.spec.ts --project=webkit --grep '300px normal 85px compact|diagnostic canvas command trace' --workers=1 --retries=0 --trace on --output test-results/linux137-canvas-state
      - name: Always preserve numeric state, screenshots and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build137-canvas-state-diagnostic
          path: test-results/linux137-canvas-state/
          retention-days: 7
          if-no-files-found: error
