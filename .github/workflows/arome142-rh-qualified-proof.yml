name: AROME142 retained49 qualified display view with explicit partial RH
on:
    push:
        branches: [codex/build-142-arome-rh-qualified-proof]
        paths: [.github/workflows/arome142-rh-qualified-proof.yml]
permissions:
    contents: read
    actions: read
concurrency:
    group: arome142-retained-rh-qualified-v1
    cancel-in-progress: false
jobs:
    qualified:
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/build-142-arome-rh-qualified-proof' && github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        env:
            PROOF_SOURCE_SHA: bbd57495546fa93bba7316f414b7d8975cf4dbec
            RH_CONTROLLER_SHA: e8137e44ee061133c41a9053e585ec3a25d0df7e
            PYTHONDONTWRITEBYTECODE: '1'
            OPENBLAS_NUM_THREADS: '1'
            OMP_NUM_THREADS: '1'
        steps:
            - name: Checkout exact reviewed control
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  path: controls
                  fetch-depth: 0
                  persist-credentials: false
            - name: Checkout exact new qualified-view scientific source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: bbd57495546fa93bba7316f414b7d8975cf4dbec
                  path: source
                  persist-credentials: false
            - name: Set up proven Python3.11.15
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.11.15'
            - name: Set up trusted Node24 with its built-in TS loader
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
            - name: Retrieve one exact existing evidence artifact without provider reads
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  python -c "from datetime import datetime,timezone;assert datetime.now(timezone.utc)<datetime(2026,10,17,18,tzinfo=timezone.utc),'original18UTC expiry'"
                  umask 077
                  mkdir "$RUNNER_TEMP/arome142-rh-qualified-evidence"
                  test ! -e "$RUNNER_TEMP/arome142-rh-retained.zip"
                  (unset POSIXLY_CORRECT; ulimit -f 163840; timeout --signal=TERM --kill-after=2s 90s env -i PATH=/usr/bin:/bin HOME=/tmp GH_CONFIG_DIR="$RUNNER_TEMP/arome142-rh-empty-gh" GH_HOST=github.com GH_PROMPT_DISABLED=1 GH_TOKEN="$GH_TOKEN" /usr/bin/gh api repos/shanestratton/thalassa-marine-weather/actions/artifacts/12104635869/zip) > "$RUNNER_TEMP/arome142-rh-retained.zip" 2> "$RUNNER_TEMP/arome142-rh-qualified-evidence/retained-artifact-download.txt"
            - name: Four plus nine compiled fixtures and actual TS interoperability before retained-only qualification
              shell: bash
              run: bash controls/ci/arome142-rh-qualified/run.sh
            - name: Preserve bounded text and up to three representative tiles on every outcome
              if: always()
              shell: bash
              run: python controls/ci/arome142-rh-qualified/collect.py
            - name: Preserve qualification evidence without originals, scratch or runtime copies
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: arome142-rh-qualified-${{ github.run_id }}
                  path: ${{ runner.temp }}/arome142-rh-qualified-artifact
                  if-no-files-found: error
                  retention-days: 14
