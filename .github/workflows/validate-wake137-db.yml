name: Build137 isolated wake transaction proof
on:
  push:
    branches: ['codex/build-137-wake-db-validation']
    paths: ['.github/workflows/validate-wake137-db.yml']
permissions:
  contents: read
concurrency:
  group: wake137-isolated-transaction-proof
  cancel-in-progress: false
jobs:
  transaction:
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: wake137_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: '0'
      THALASSA_DISPOSABLE_WAKE_TEST: '1'
      WAKE_TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/wake137_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'f2ad6bf37c82762da8ebe6dc553da09f0b6dff75'
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify exact source and preserve isolated identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f2ad6bf37c82762da8ebe6dc553da09f0b6dff75
          mkdir -p "$RUNNER_TEMP/wake137-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/wake137-proof/SOURCE_SHA.txt"
          sha256sum scripts/check-pi-wake-postgres.mjs tests/sql/pi-wake-base.sql supabase/held-migrations/20261016135225_pi_wake_keeper_relay.sql supabase/functions/pi-alarm-relay/wake-contract.ts utils/wakeRule.ts > "$RUNNER_TEMP/wake137-proof/SHA256SUMS"
      - name: Install frozen fixture runner and isolated PostgreSQL client
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/wake137-pg" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
          test "$(node -p "require('$RUNNER_TEMP/wake137-pg/node_modules/pg/package.json').version")" = 8.16.3
          sha256sum "$RUNNER_TEMP/wake137-pg/package-lock.json" > "$RUNNER_TEMP/wake137-proof/CLIENT_LOCK_SHA256.txt"
      - name: Sixteen real transactions, exact quota, competing CAS and retirement
        env:
          PG_MODULE_PATH: ${{ runner.temp }}/wake137-pg/node_modules/pg/lib/index.js
        run: |
          set -euo pipefail
          node node_modules/tsx/dist/cli.mjs scripts/check-pi-wake-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/wake137-proof/CONCURRENCY.txt"
      - name: Preserve isolated proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build137-wake-transaction-proof
          path: ${{ runner.temp }}/wake137-proof/
          retention-days: 7
          if-no-files-found: error
