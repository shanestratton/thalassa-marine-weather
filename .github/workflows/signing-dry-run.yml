name: Thalassa signing dry run (NO UPLOAD)

# One-time setup verification requested by Shane, 2026-10-11.
# Isolated branch only. Build the exact existing PR #57 commit, not this helper branch.
# PR #57's failing browser check remains a release blocker. This does not merge it.
# This job has NO TestFlight upload step, NO upload destination, and NO artifacts.
# The normal manual release workflow and its owner-only protections are unchanged.
on:
    push:
        branches: ['codex/thalassa-signing-dry-run']
        paths: ['.github/workflows/signing-dry-run.yml']

permissions:
    contents: read

concurrency:
    group: ios-testflight-release
    cancel-in-progress: false

jobs:
    signing-check:
        if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton'
        runs-on: macos-26
        timeout-minutes: 90
        env:
            CI: 'true'
            HUSKY: '0'
            NODE_OPTIONS: --max-old-space-size=4096
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
            VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
            VITE_MAPBOX_ACCESS_TOKEN: ${{ vars.VITE_MAPBOX_ACCESS_TOKEN }}
            VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
            VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
            VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
            TEAM_ID: D4TW8A23QZ
            BUNDLE_ID: com.thalassa.weather
            SOURCE_SHA: cf0b6c3b5786eb656258211fd73f8694b1df0bf0
            EXPECTED_BUILD: '126'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: cf0b6c3b5786eb656258211fd73f8694b1df0bf0
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: npm
            - name: Confirm pinned source and toolchain
              shell: bash
              run: |
                  set -euo pipefail
                  [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo '::error::Unexpected source commit'; exit 1; }
                  [ -d "$DEVELOPER_DIR" ] || { echo '::error::Required Xcode 26.6 is not installed'; exit 1; }
                  case "$(xcodebuild -version | head -1)" in
                      'Xcode 26.6'*) ;;
                      *) echo '::error::Expected Xcode 26.6'; exit 1 ;;
                  esac
                  node --version | grep -q '^v24\.'
                  {
                      echo '## Signing setup verification only'
                      echo 'No upload is possible in this helper workflow. No app or signing material is retained as an artifact.'
                      echo 'PR #57 remains unmerged; its browser regression failure is not waived by this check.'
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Confirm committed build and app version
              shell: bash
              run: |
                  set -euo pipefail
                  pbx=ios/App/App.xcodeproj/project.pbxproj
                  builds=$(grep -oE 'CURRENT_PROJECT_VERSION = [0-9]+;' "$pbx" | grep -oE '[0-9]+' | sort -u)
                  [ "$builds" = "$EXPECTED_BUILD" ] || { echo '::error::Committed build differs from the pinned dry-run build'; exit 1; }
                  marketing=$(node -p "require('./package.json').version")
                  {
                      echo "VITE_APP_BUILD=$EXPECTED_BUILD"
                      echo "APP_BUILD=$EXPECTED_BUILD"
                      echo "APP_VERSION=$marketing"
                  } >> "$GITHUB_ENV"
                  echo "Dry run: $BUNDLE_ID $marketing ($EXPECTED_BUILD), commit $SOURCE_SHA"
            - name: Google sign-in client matches the app URL scheme
              shell: bash
              run: |
                  set -euo pipefail
                  case "$VITE_GOOGLE_OAUTH_CLIENT_ID" in
                      *.apps.googleusercontent.com) ;;
                      *) echo '::error::Invalid Google OAuth client ID'; exit 1 ;;
                  esac
                  scheme="com.googleusercontent.apps.${VITE_GOOGLE_OAUTH_CLIENT_ID%.apps.googleusercontent.com}"
                  grep -qF "<string>${scheme}</string>" ios/App/App/Info.plist || { echo '::error::Google URL scheme mismatch'; exit 1; }
            - name: CocoaPods through the pinned Bundler
              shell: bash
              run: |
                  set -euo pipefail
                  pinned=$(awk '/^BUNDLED WITH/{getline; gsub(/ /,""); print}' ios/App/Gemfile.lock)
                  if ! gem install bundler -v "$pinned" --no-document; then
                      gem install bundler -v "$pinned" --no-document --user-install
                      echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
                      export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
                  fi
                  {
                      echo "BUNDLER_VERSION=$pinned"
                      echo "BUNDLE_PATH=$RUNNER_TEMP/gems"
                      echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/bundle-config"
                      echo 'BUNDLE_FROZEN=true'
                  } >> "$GITHUB_ENV"
                  BUNDLER_VERSION="$pinned" BUNDLE_PATH="$RUNNER_TEMP/gems" BUNDLE_APP_CONFIG="$RUNNER_TEMP/bundle-config" \
                      BUNDLE_FROZEN=true BUNDLE_GEMFILE=ios/App/Gemfile bundle install
                  BUNDLER_VERSION="$pinned" node scripts/cap-sync.mjs --check
            - run: npm ci
            - name: All existing ship beta packaging gates
              run: GITHUB_SHA="$(git rev-parse HEAD)" npm run ship:beta
            - name: Import the saved signing certificate and Apple API key
              shell: bash
              env:
                  IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
                  IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
              run: |
                  set -euo pipefail
                  for name in IOS_DEV_CERT_P12_BASE64 IOS_DEV_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
                      [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
                  done
                  case "$ASC_KEY_P8" in
                      *'-----BEGIN PRIVATE KEY-----'*'-----END PRIVATE KEY-----'*) ;;
                      *) echo '::error::ASC_KEY_P8 is not the private-key file text'; exit 1 ;;
                  esac
                  keychain="$RUNNER_TEMP/signing.keychain-db"
                  password=$(openssl rand -hex 24)
                  echo "::add-mask::$password"
                  umask 077
                  security create-keychain -p "$password" "$keychain"
                  echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
                  security set-keychain-settings -lut 5400 "$keychain"
                  security unlock-keychain -p "$password" "$keychain"
                  printf '%s' "$IOS_DEV_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
                  security import "$RUNNER_TEMP/dev.p12" -k "$keychain" -P "$IOS_DEV_CERT_PASSWORD" -x -T /usr/bin/codesign
                  rm -f "$RUNNER_TEMP/dev.p12"
                  security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
                  security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
                  security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Development' || {
                      echo '::error::No Apple Development signing identity in the saved certificate'; exit 1
                  }
                  mkdir -p "$RUNNER_TEMP/asc"
                  printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
                  echo '- All five saved entries are present; certificate imported. Apple authentication is tested by the following steps.' >> "$GITHUB_STEP_SUMMARY"
            - name: Archive using Apple Development automatic signing
              shell: bash
              env:
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
                      -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
                      -archivePath "$RUNNER_TEMP/Thalassa.xcarchive" -allowProvisioningUpdates \
                      -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
                      -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
            - name: Export locally with cloud-managed Apple Distribution (NOT upload)
              shell: bash
              env:
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
              run: |
                  set -euo pipefail
                  cat > "$RUNNER_TEMP/ExportOptions-export.plist" <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0"><dict>
                      <key>method</key><string>app-store-connect</string>
                      <key>destination</key><string>export</string>
                      <key>teamID</key><string>$TEAM_ID</string>
                      <key>signingStyle</key><string>automatic</string>
                      <key>uploadSymbols</key><true/>
                      <key>manageAppVersionAndBuildNumber</key><false/>
                  </dict></plist>
                  PLIST
                  plutil -lint "$RUNNER_TEMP/ExportOptions-export.plist"
                  xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Thalassa.xcarchive" \
                      -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
                      -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
                      -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            - name: Verify the signed app with the existing release checks
              shell: bash
              run: |
                  set -euo pipefail
                  ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
                  mkdir "$RUNNER_TEMP/ipa"
                  ditto -x -k "$ipa" "$RUNNER_TEMP/ipa"
                  app=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
                  plist="$app/Info.plist"
                  pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist"; }
                  fail() { echo "::error::$1"; exit 1; }
                  [ "$(pb CFBundleIdentifier)" = "$BUNDLE_ID" ] || fail 'bundle identifier'
                  [ "$(pb CFBundleShortVersionString)" = "$APP_VERSION" ] || fail 'marketing version'
                  [ "$(pb CFBundleVersion)" = "$APP_BUILD" ] || fail 'build number'
                  [ "$(pb MinimumOSVersion)" = '17.0' ] || fail 'minimum iOS'
                  [ "$(pb ITSAppUsesNonExemptEncryption)" = false ] || fail 'export compliance key'
                  modes=$(pb UIBackgroundModes)
                  for mode in audio location fetch; do printf '%s' "$modes" | grep -qw "$mode" || fail "background mode $mode"; done
                  [ ! -e "$app/Watch" ] && [ ! -e "$app/PlugIns" ] || fail 'Watch app or extension embedded'
                  codesign --verify --deep --strict "$app"
                  sig=$(codesign -dvv "$app" 2>&1)
                  printf '%s' "$sig" | grep -q '^Authority=Apple Distribution' || fail 'not Apple Distribution'
                  printf '%s' "$sig" | grep -q "^TeamIdentifier=$TEAM_ID$" || fail 'team identifier'
                  ent="$RUNNER_TEMP/entitlements.plist"
                  codesign -d --entitlements - --xml "$app" > "$ent" 2>/dev/null
                  e() { /usr/libexec/PlistBuddy -c "Print :$1" "$ent"; }
                  [ "$(e application-identifier)" = "$TEAM_ID.$BUNDLE_ID" ] || fail 'application-identifier'
                  [ "$(e aps-environment)" = production ] || fail 'aps-environment'
                  [ "$(e get-task-allow)" = false ] || fail 'get-task-allow'
                  [ "$(e beta-reports-active)" = true ] || fail 'beta-reports-active'
                  [ "$(e com.apple.developer.weatherkit)" = true ] || fail 'WeatherKit'
                  [ "$(e com.apple.developer.usernotifications.time-sensitive)" = true ] || fail 'time-sensitive notifications'
                  e com.apple.developer.applesignin | grep -q Default || fail 'Sign in with Apple'
                  e com.apple.developer.associated-domains | grep -q 'applinks:www.thalassawx.app' || fail 'associated domains'
                  e com.apple.developer.nfc.readersession.formats | grep -q TAG || fail 'NFC tag reading'
                  (cd dist && find . -type f ! -name '*.map' | sort) > "$RUNNER_TEMP/dist-files.txt"
                  while IFS= read -r file; do cmp -s "dist/$file" "$app/public/$file" || fail "public/$file differs from dist"; done < "$RUNNER_TEMP/dist-files.txt"
                  [ -z "$(find "$app/public" -name '*.map' -print -quit)" ] || fail 'source maps in app'
                  grep -rqF "$(git rev-parse HEAD | cut -c1-12)" "$app/public/assets" || fail 'commit stamp differs'
                  main=$(ls "$app"/public/assets/main-*.js)
                  {
                      echo "### Verified locally: $BUNDLE_ID $APP_VERSION ($APP_BUILD)"
                      echo "- Source commit: \`$(git rev-parse HEAD)\`"
                      echo "- $(xcodebuild -version | tr '\n' ' ')"
                      echo "- Apple Distribution, team $TEAM_ID; production entitlements checked"
                      echo "- Web files: $(wc -l < "$RUNNER_TEMP/dist-files.txt" | tr -d ' ') byte-identical to dist"
                      echo "- Main asset SHA-256: \`$(shasum -a 256 "$main" | cut -d' ' -f1)\`"
                      echo "- Verified IPA SHA-256: \`$(shasum -a 256 "$ipa" | cut -d' ' -f1)\`"
                      echo '- NOT uploaded to TestFlight. This is signing setup verification, not release approval.'
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Delete temporary signing material and app outputs
              if: always()
              shell: bash
              run: |
                  keychain="${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}"
                  if [ -e "$keychain" ]; then security delete-keychain "$keychain" || true; fi
                  rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dev.p12" "$RUNNER_TEMP/export" \
                      "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/Thalassa.xcarchive" "$RUNNER_TEMP/dd"
                  rm -f "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/ExportOptions-export.plist"
