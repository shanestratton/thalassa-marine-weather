name: Build137 isolated radar transaction proof
on:
    push:
        branches: ['codex/build-137-radar-db-validation']
        paths: ['.github/workflows/validate-radar137-db.yml']
permissions:
    contents: read
concurrency:
    group: radar137-isolated-transaction-proof
    cancel-in-progress: false
jobs:
    transaction:
        if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:17.6
                env:
                    POSTGRES_PASSWORD: fixture-only-password
                    POSTGRES_DB: radar137_test
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres -d radar137_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        defaults:
            run:
                working-directory: source
        env:
            HUSKY: '0'
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            THALASSA_DISPOSABLE_RADAR_TEST: '1'
            RADAR_TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/radar137_test
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.sha }}
                  path: controls
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: 173042e8d95544e574e5aa372d9e849162f02f24
                  path: source
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
            - name: Verify exact source and single controlled fixture definition
              working-directory: .
              run: |
                  set -euo pipefail
                  test "$(git -C source rev-parse HEAD)" = 173042e8d95544e574e5aa372d9e849162f02f24
                  test "$(git -C controls rev-parse HEAD)" = "$GITHUB_SHA"
                  test -z "$(git -C source status --porcelain)"
                  test "$(git -C controls diff --name-only 4d22c003bb5493b3573b1d0f394a5a3dc74f4b07 HEAD)" = .github/workflows/validate-radar137-db.yml
                  mkdir -p "$RUNNER_TEMP/radar137-proof"
                  git -C source rev-parse HEAD > "$RUNNER_TEMP/radar137-proof/SOURCE_SHA.txt"
                  printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/radar137-proof/DEFINITION_SHA.txt"
                  sha256sum controls/.github/workflows/validate-radar137-db.yml > "$RUNNER_TEMP/radar137-proof/DEFINITION_SHA256.txt"
                  cd source
                  sha256sum scripts/check-pi-radar-postgres.mjs tests/sql/pi-wake-base.sql supabase/migrations/20261016154726_pi_wake_keeper_relay.sql supabase/held-migrations/20261016162758_pi_radar_relay.sql utils/radarRelayContract.ts supabase/functions/pi-alarm-relay/radar-contract.ts supabase/functions/pi-alarm-relay/radar-relay.ts package.json package-lock.json > "$RUNNER_TEMP/radar137-proof/SHA256SUMS"
            - name: Install frozen fixture runner and exact isolated PostgreSQL client
              run: |
                  set -euo pipefail
                  npm ci --ignore-scripts --no-audit --no-fund
                  npm install --prefix "$RUNNER_TEMP/radar137-pg" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
                  test "$(node -p "require('$RUNNER_TEMP/radar137-pg/node_modules/pg/package.json').version")" = 8.16.3
                  sha256sum "$RUNNER_TEMP/radar137-pg/package-lock.json" > "$RUNNER_TEMP/radar137-proof/CLIENT_LOCK_SHA256.txt"
            - name: Real mixed caller budgets, original ACK clocks, canonical deduplication, competing CAS and retirement
              timeout-minutes: 3
              env:
                  PG_MODULE_PATH: ${{ runner.temp }}/radar137-pg/node_modules/pg/lib/index.js
              run: |
                  set -euo pipefail
                  timeout 120s node node_modules/tsx/dist/cli.mjs scripts/check-pi-radar-postgres.mjs 2>&1 | tee "$RUNNER_TEMP/radar137-proof/CONCURRENCY.txt"
            - name: Verify unchanged source after disposable database proof
              if: always()
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = 173042e8d95544e574e5aa372d9e849162f02f24
                  test -z "$(git status --porcelain)"
            - name: Preserve isolated proof and identities
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build137-radar-transaction-proof
                  path: ${{ runner.temp }}/radar137-proof/
                  retention-days: 7
                  if-no-files-found: error
