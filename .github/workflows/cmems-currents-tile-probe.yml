name: CMEMS Currents — Tile Probe (Retired)

# Retained as an explicit tombstone so an old bookmark or manual-dispatch habit
# cannot silently resurrect the retired Mapbox tileset publishing path.
on:
    workflow_dispatch:

permissions: {}

jobs:
    retired:
        runs-on: ubuntu-24.04
        timeout-minutes: 1
        permissions: {}
        steps:
            - name: Refuse retired Mapbox tile probe
              run: |
                  echo "::notice::Retired: CMEMS now uses signed immutable release assets; the Mapbox tile probe must not run."
                  exit 78
