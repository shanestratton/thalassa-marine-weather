name: Build140 isolated AIS receiver coverage database proof
on:
    push:
        branches: ['codex/build-140-ais-coverage-db']
        paths:
            - '.github/workflows/ais-receiver-coverage-db.yml'
            - 'supabase/tests/ais-receiver-coverage-*'
            - 'supabase/migrations/20261017011825_ais_receiver_coverage.sql'
    workflow_dispatch:
        inputs:
            source_sha:
                description: Exact reviewed source commit (40 lowercase hex characters)
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: ais-receiver140-isolated-${{ github.run_id }}
    cancel-in-progress: false
jobs:
    postgres:
        if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton'
        runs-on: ubuntu-24.04
        timeout-minutes: 12
        services:
            postgres:
                image: postgis/postgis:17-3.5
                env:
                    POSTGRES_PASSWORD: fixture-only-password
                    POSTGRES_DB: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd pg_isready --health-interval 5s
                    --health-timeout 5s --health-retries 10
        env:
            SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
            THALASSA_DISPOSABLE_AIS_RECEIVER_TEST: '1'
            AIS_RECEIVER_TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/ais_receiver140_test
        steps:
            - name: Require an exact reviewed source
              shell: bash
              run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.source_sha || github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - name: Record source and actual PostgreSQL image
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
                  mkdir -p "$RUNNER_TEMP/ais-receiver140-proof"
                  git rev-parse HEAD > "$RUNNER_TEMP/ais-receiver140-proof/SOURCE_SHA.txt"
                  node --version > "$RUNNER_TEMP/ais-receiver140-proof/NODE_VERSION.txt"
                  docker image inspect postgis/postgis:17-3.5 --format '{{.Id}}' > "$RUNNER_TEMP/ais-receiver140-proof/POSTGRES_IMAGE_ID.txt"
                  sha256sum supabase/tests/ais-receiver-coverage-* supabase/migrations/20261017011825_ais_receiver_coverage.sql supabase/migrations/20260318080000_ais_vessels.sql supabase/migrations/20261016072703_ais_fleet_budget.sql > "$RUNNER_TEMP/ais-receiver140-proof/SHA256SUMS"
            - name: Install only pinned isolated PostgreSQL client
              shell: bash
              run: |
                  set -euo pipefail
                  npm install --prefix "$RUNNER_TEMP/ais-receiver140-pg" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
                  test "$(node -p "require('$RUNNER_TEMP/ais-receiver140-pg/node_modules/pg/package.json').version")" = 8.16.3
                  sha256sum "$RUNNER_TEMP/ais-receiver140-pg/package-lock.json" > "$RUNNER_TEMP/ais-receiver140-proof/CLIENT_LOCK_SHA256.txt"
            - name: Create only the empty isolated receiver fixture
              env:
                  PGPASSWORD: fixture-only-password
              shell: bash
              run: createdb -h 127.0.0.1 -p 5432 -U postgres --maintenance-db=postgres --template=template0 ais_receiver140_test
            - name: Execute actual migrations, PostGIS privacy and competing transactions
              env:
                  PG_MODULE_PATH: ${{ runner.temp }}/ais-receiver140-pg/node_modules/pg/lib/index.js
              shell: bash
              run: |
                  set -euo pipefail
                  node supabase/tests/ais-receiver-coverage-db.mjs 2>&1 | tee "$RUNNER_TEMP/ais-receiver140-proof/POSTGRES.txt"
            - name: Preserve success or failure proof
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: build140-ais-receiver-database-proof
                  path: ${{ runner.temp }}/ais-receiver140-proof/
                  retention-days: 7
                  if-no-files-found: error
