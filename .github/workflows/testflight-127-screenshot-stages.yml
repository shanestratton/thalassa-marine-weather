                  console.log(JSON.stringify({phase,browser,sourcePins:sourceInputs.length,revisedBodyVerified:true,eightOriginalExpectsVerified:true,completeOriginalBlocksVerified:true,
                   measuredPairFiles:output.measuredPairFiles?.length??null,proofOutcome:output.proofOutcome??null}));
                  NODE
            - name: Record actual focused result and honest body scope
              if: always() && steps.source.outcome == 'success'
              env:
                  PROOF_OUTCOME: ${{ steps.proof.outcome }}
                  BROWSER: ${{ matrix.browser }}
              run: |
                  echo "$BROWSER DIAGNOSTIC revised-capture repetition: $PROOF_OUTCOME on $CANDIDATE_SHA. Eight original expect lines/full colour assertion blocks and 150s budget/profile unchanged; 1 diagnostic repetition/0 retries/no forced tracing; passive Node CDP timing observer added, not release acceptance. Actual ON/OFF pair PNGs retained on success and failure. Diagnostic observation only, not whole release or compositor-cause proof." >> "$GITHUB_STEP_SUMMARY"
            - name: Preserve genuine transport stages and diagnostic limitations
              if: always()
              run: |
                  node --input-type=module <<'NODE'
                  import {readdirSync,readFileSync,lstatSync,copyFileSync} from 'node:fs';
                  import {join} from 'node:path';
                  import {createHash} from 'node:crypto';
                  const directory=join(process.env.RUNNER_TEMP,'wind-cdp-stages');
                  let actual=0;
                  for(const name of readdirSync(directory)){
                    if(!/^chromium-screenshot-stages-\d+\.json$/.test(name)) throw Error('Unexpected stage filename');
                    const path=join(directory,name),stat=lstatSync(path);
                    if(!stat.isFile()||stat.isSymbolicLink()||stat.size>131072||(stat.mode&0o777)!==0o600) throw Error('Private bounded stage output refused');
                    const bytes=readFileSync(path),r=JSON.parse(bytes);
                    if(r.sourceCommit!==process.env.CANDIDATE_SHA||r.observer.sha256!=='d679e82f70d114dfafffc7ec2e9a00c0f1d86d616d2756886b35175bd5686c59'||r.chromiumModule.sha256!=='0d41a058ad1f5c897329a9c821c52b952e0e709ab38c3e6e355224b167922f13'||!r.sourceHashesStableAtExit||!r.diagnosticOnly||r.argumentsResultsAndErrorsRecorded||r.browserOrRenderCommandsAdded||!Array.isArray(r.records)||r.records.length>32) throw Error('Stage source/scope binding differs');
                    if(r.records.some(row=>!['Page.getLayoutMetrics','Page.captureScreenshot'].includes(row.method))) throw Error('Unknown recorded command');
                    actual+=r.records.filter(row=>row.method==='Page.captureScreenshot').length;
                    copyFileSync(path,name,1);
                    console.log(JSON.stringify({file:name,sha256:createHash('sha256').update(bytes).digest('hex'),entryKind:r.process.entryKind,records:r.records,diagnosticOnly:true}));
                  }
                  if(actual===0) throw Error('No actual screenshot transport call observed; never reconstruct missing evidence');
                  console.log('Passive observer adds Promise settlement reactions; diagnostic timing is perturbed, not release acceptance. Killed processes may leave no ordinary-exit receipt.');
                  NODE
            - name: Preserve JSON, source hash receipts and actual measured pair PNGs on success too
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: build127-passive-screenshot-stage-${{ matrix.browser }}
                  path: |
                      chromium-screenshot-stages-*.json
                      wind-focused-results.json
                      wind-source-hashes-before.json
                      wind-source-hashes-after.json
                      test-results/**/desk-wind-light-streaks-*.png
                      test-results/**/desk-wind-relief-sat-streaks-*.png
                  retention-days: 7
                  if-no-files-found: warn
