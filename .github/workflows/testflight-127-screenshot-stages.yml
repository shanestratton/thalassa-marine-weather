                  import {join} from 'node:path';
                  import {createHash} from 'node:crypto';
                  const bytes=Buffer.from('','base64');
                  if(createHash('sha256').update(bytes).digest('hex')!=='d679e82f70d114dfafffc7ec2e9a00c0f1d86d616d2756886b35175bd5686c59') throw Error('Reviewed observer hash differs');
                  mkdirSync(join(process.env.RUNNER_TEMP,'wind-cdp-stages'),{mode:0o700});
                  writeFileSync(join(process.env.RUNNER_TEMP,'screenshot-stage-observer.cjs'),bytes,{mode:0o600,flag:'wx'});
                  for(const [name,path] of [
                    ['THALASSA_SCREENSHOT_STAGE_MODULE',join(process.cwd(),'node_modules/playwright-core/lib/server/chromium/crConnection.js')],
                    ['THALASSA_SCREENSHOT_STAGE_OUTPUT',join(process.env.RUNNER_TEMP,'wind-cdp-stages')],
                  ]) writeFileSync(process.env.GITHUB_ENV,name+'='+realpathSync(path)+'\n',{flag:'a'});
                  writeFileSync(process.env.GITHUB_ENV,'THALASSA_SCREENSHOT_STAGE_OBSERVER_SHA=d679e82f70d114dfafffc7ec2e9a00c0f1d86d616d2756886b35175bd5686c59\n',{flag:'a'});
