name: Thalassa build 127 Apple status (READ ONLY)

# Fresh metadata only. No source checkout, dependency install, signing, upload,
# Apple write, tester change or secret artifact. The JWT is held only in memory
# for two minutes and scoped to the exact GET being made.
on:
    push:
        branches: ['codex/testflight-127-status-2026-10-12']
        paths: ['.github/workflows/testflight-status-readonly.yml']

permissions:
    contents: read

concurrency:
    group: testflight-127-status-readonly
    cancel-in-progress: false

jobs:
    read-status:
        if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  package-manager-cache: false
            - name: Read complete iOS 1.2.0 build metadata without changing Apple
              shell: bash
              env:
                  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
                  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
                  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
              run: |
                  node --input-type=module <<'NODE'
                  import { createPrivateKey, sign } from 'node:crypto';
                  import { appendFileSync } from 'node:fs';
                  const origin = 'https://api.appstoreconnect.apple.com';
                  const appId = '6809058745';
                  const bundleId = 'com.thalassa.weather';
                  const marketingVersion = '1.2.0';
                  const keyId = process.env.ASC_KEY_ID;
                  const issuerId = process.env.ASC_ISSUER_ID;
                  const pem = process.env.ASC_KEY_P8;
                  delete process.env.ASC_KEY_ID;
                  delete process.env.ASC_ISSUER_ID;
                  delete process.env.ASC_KEY_P8;
                  if (!keyId || !issuerId || !pem) throw new Error('An existing Apple API secret is missing');
                  let key;
                  try { key = createPrivateKey(pem); }
                  catch { throw new Error('Unable to parse the existing Apple API key'); }
                  const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
                  function assertDestination(url) {
                    if (url.origin !== origin || !['/v1/apps', '/v1/builds'].includes(url.pathname) ||
                        url.username || url.password || url.hash) throw new Error('Unexpected Apple API destination');
                    if (url.pathname === '/v1/apps') {
                      if (url.searchParams.get('filter[bundleId]') !== bundleId) throw new Error('Unexpected Apple app lookup');
                    } else if (url.searchParams.get('filter[app]') !== appId ||
                        url.searchParams.get('filter[preReleaseVersion.version]') !== marketingVersion ||
                        url.searchParams.get('filter[preReleaseVersion.platform]') !== 'IOS') {
                      throw new Error('Unexpected Apple build query');
                    }
                  }
                  async function get(url) {
                    assertDestination(url);
                    const now = Math.floor(Date.now() / 1000);
                    const content = encode({ alg: 'ES256', kid: keyId, typ: 'JWT' }) + '.' + encode({
                      iss: issuerId, iat: now, exp: now + 120, aud: 'appstoreconnect-v1',
                      scope: [`GET ${url.pathname}${url.search}`],
                    });
                    const token = content + '.' + sign('sha256', Buffer.from(content), {key, dsaEncoding:'ieee-p1363'}).toString('base64url');
                    // Neither key material nor JWTs are printed, saved or put in artifacts.
                    const response = await fetch(url, {
                      method: 'GET', redirect: 'error', signal: AbortSignal.timeout(30000),
                      headers: {Authorization: `Bearer ${token}`, Accept: 'application/json'},
                    });
                    if (!response.ok) throw new Error(`Apple status read failed: HTTP ${response.status}`);
                    const json = await response.json();
                    if (!Array.isArray(json.data)) throw new Error('Unexpected Apple metadata response');
                    return json;
                  }
                  async function main() {
                    const appUrl = new URL('/v1/apps', origin);
                    appUrl.search = new URLSearchParams({'filter[bundleId]':bundleId, 'fields[apps]':'bundleId', limit:'2'}).toString();
                    const apps = await get(appUrl);
                    if (apps.data.length !== 1 || apps.data[0].id !== appId || apps.data[0].attributes?.bundleId !== bundleId) {
                      throw new Error('Thalassa was not uniquely resolved to the expected Apple app');
                    }
                    let url = new URL('/v1/builds', origin);
                    url.search = new URLSearchParams({
                      'filter[app]':appId, 'filter[preReleaseVersion.version]':marketingVersion,
                      'filter[preReleaseVersion.platform]':'IOS',
                      'fields[builds]':'version,uploadedDate,processingState,expired', sort:'-uploadedDate', limit:'200',
                    }).toString();
                    const builds=[];
                    const seenPages=new Set();
                    const seenBuilds=new Set();
                    for (let page=0; url && page<10; page++) {
                      assertDestination(url);
                      if (url.pathname !== '/v1/builds' || seenPages.has(url.href)) throw new Error('Unexpected or repeated Apple build pagination');
                      seenPages.add(url.href);
                      const data=await get(url);
                      for (const build of data.data) {
                        if (typeof build.id !== 'string' || !build.id || seenBuilds.has(build.id) ||
                            typeof build.attributes?.version !== 'string') throw new Error('Incomplete or duplicate Apple build metadata');
                        seenBuilds.add(build.id);
                        const {version, uploadedDate, processingState, expired}=build.attributes;
                        builds.push({id:build.id, build:version, uploadedDate:uploadedDate ?? null,
                          processingState:processingState ?? null, expired:expired ?? null});
                      }
                      if (data.links?.next != null && typeof data.links.next !== 'string') throw new Error('Unexpected Apple next-page link');
                      url=data.links?.next ? new URL(data.links.next, origin) : null;
                    }
                    if (url) throw new Error('Build listing limit exceeded; complete build history was not proven');
                    const numeric=b=>/^\d+(?:\.\d+){0,2}$/.test(b.build);
                    const integers=builds.filter(b=>/^\d+$/.test(b.build)).map(b=>BigInt(b.build));
                    const highest=integers.length ? integers.reduce((a,b)=>a>b?a:b).toString() : null;
                    const variants127=builds.filter(b=>numeric(b) && BigInt(b.build.split('.')[0])===127n);
                    const summary={
                      observedAt:new Date().toISOString(), workflowCommit:process.env.GITHUB_SHA ?? null,
                      bundleId, appId, marketingVersion, platform:'IOS',
                      totalBuildsListed:builds.length, completePagination:true, pagesRead:seenPages.size,
                      highestIntegerBuild:highest,
                      build127Observed:variants127.length>0, build127Variants:variants127,
                      buildsAtOrAbove127:builds.filter(b=>numeric(b) && BigInt(b.build.split('.')[0])>=127n),
                      unexpectedBuildNumbers:builds.filter(b=>!numeric(b)),
                      newestBuilds:builds.slice(0,10),
                      operation:'GET only; no signing, upload, app writes or tester writes',
                      testerAvailability:'Not inspected; processing VALID does not prove assignment to Skipper or availability',
                      releaseDecision:'Metadata snapshot only; absence does not reserve a build number or clear an ambiguous previous upload',
                    };
                    const text=JSON.stringify(summary,null,2);
                    console.log(text);
                    appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                      '# Build 127 Apple metadata — GET only\n\n```json\n'+text+'\n```\n\n'+
                      'No release action was taken. Re-check immediately before any authorized upload; stop on existing or ambiguous 127.\n');
                  }
                  main().catch(error=>{console.error(error.message);process.exitCode=1;});
                  NODE
