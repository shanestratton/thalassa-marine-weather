name: Build137 isolated shore consent and concurrency proof
on:
  push:
    branches: ['codex/build-137-shore-db-validation']
    paths: ['.github/workflows/validate-shore137-db.yml']
permissions:
  contents: read
concurrency:
  group: shore137-isolated-database-proof
  cancel-in-progress: false
jobs:
  shore:
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: shore137_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: '0'
      THALASSA_DISPOSABLE_SHORE_TEST: '1'
      SHORE_CONTACTS_TEST_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/shore137_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '580b575e08e7a4d476188e863268e08325e7c93b'
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify exact source and preserve isolated fixture identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 580b575e08e7a4d476188e863268e08325e7c93b
          mkdir -p "$RUNNER_TEMP/shore137-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/shore137-proof/SOURCE_SHA.txt"
          node --version > "$RUNNER_TEMP/shore137-proof/NODE_VERSION.txt"
          sha256sum supabase/tests/shore-contacts-db.mjs supabase/held-migrations/20261016174406_shore_contacts.sql utils/shoreContacts.ts supabase/functions/anchor-alert-messaging/handler.ts supabase/functions/anchor-alert-messaging/transport.ts supabase/functions/telegram-webhook/handler.ts > "$RUNNER_TEMP/shore137-proof/SHA256SUMS"
          docker image inspect postgres:17.6 --format '{{.Id}}' > "$RUNNER_TEMP/shore137-proof/POSTGRES_IMAGE_ID.txt"
      - name: Install only the isolated pinned PostgreSQL client
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/shore137-pg" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
          test "$(node -p "require('$RUNNER_TEMP/shore137-pg/node_modules/pg/package.json').version")" = 8.16.3
          sha256sum "$RUNNER_TEMP/shore137-pg/package-lock.json" > "$RUNNER_TEMP/shore137-proof/CLIENT_LOCK_SHA256.txt"
      - name: Actual owner privacy consent clocks and four lock-barrier cohorts
        env:
          PG_MODULE_PATH: ${{ runner.temp }}/shore137-pg/node_modules/pg/lib/index.js
        run: |
          set -euo pipefail
          node supabase/tests/shore-contacts-db.mjs 2>&1 | tee "$RUNNER_TEMP/shore137-proof/SHORE.txt"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Fixed recipient and transport boundaries with synthetic HTTP only
        run: |
          set -euo pipefail
          deno test supabase/functions/anchor-alert-messaging/handler_test.ts supabase/functions/telegram-webhook/handler_test.ts 2>&1 | tee "$RUNNER_TEMP/shore137-proof/EDGE.txt"
      - name: Preserve isolated proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build137-shore-postgres-proof
          path: ${{ runner.temp }}/shore137-proof/
          retention-days: 7
          if-no-files-found: error
