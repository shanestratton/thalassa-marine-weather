name: Thalassa 138 read-only beta status
on:
  push:
    branches: ["codex/build-138-tester-status"]
    paths: [".github/workflows/read-testflight-138-status.yml"]
permissions:
  contents: read
concurrency:
  group: thalassa-138-beta-status
  cancel-in-progress: false
jobs:
  read:
    name: Read Apple beta metadata only
    if: github.repository == 'shanestratton/thalassa-marine-weather' && github.actor == 'shanestratton' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 33101c97fd3e23ce3e24ca59671649c816db3a78
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test read-only destination, identity and pagination checks
        run: node --test ci/build138/tester-status.test.mjs
      - name: Read exact build 138 beta state and anonymous group counts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: node ci/build138/tester-status.mjs --require-ready
