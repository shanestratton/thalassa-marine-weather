version: 2

updates:
    # npm dependencies
    # Monthly since 2026-10: every update pull request runs the quick CI, and on
    # a private repository those minutes are billed. Security updates are not
    # affected by this schedule; Dependabot raises them as soon as they exist.
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'monthly'
      # The repo's default (and only) branch — 'main' here silently killed
      # every npm update PR because the branch doesn't exist.
      target-branch: 'master'
      open-pull-requests-limit: 10
      labels:
          - 'dependencies'
      groups:
          # Group minor and patch updates to reduce PR noise
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'
          # Capacitor ecosystem — update together
          capacitor:
              patterns:
                  - '@capacitor/*'
          # Testing tools — update together
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
                  - '@testing-library/*'
                  - '@playwright/*'
                  - 'playwright'
          # React ecosystem
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'

    # GitHub Actions versions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      labels:
          - 'ci'
          - 'dependencies'
